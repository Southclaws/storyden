$schema: http://json-schema.org/draft-07/schema#
$id: ToolToolSearch
x-storyden-tool:
  toolsets:
    - system.robot_studio
  title: Search Tools
  role: USE_ROBOTS
  annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }
title: tool_search
description: >-
  Search for individual tools that can perform one narrow task. Use the candidate's
  id with tool_get to inspect its schema and preconditions. Availability is callable
  (invoke callable_name), load_required (activate the ID with tool_load, then invoke
  it on the next model step), or blocked (resolve preconditions or inspect
  tool_runtime_issues when available). If tool_get marks a tool toolset_only, inspect
  and load a declared Toolset with toolset_get and toolset_load instead. Inspection
  alone does not activate a tool.
type: object
required: [input, output]
properties:
  input: { $ref: "#/definitions/ToolToolSearchInput" }
  output: { $ref: "#/definitions/ToolToolSearchOutput" }
definitions:
  ToolToolSearchInput:
    type: object
    required: [query]
    properties:
      query:
        type: string
        minLength: 1
        description: Capability, task, or tool name to search for.
      max_results:
        type: integer
        minimum: 1
        maximum: 20
        description: Maximum number of ranked candidates to return; omit to use the default.
    additionalProperties: false
  ToolToolSearchOutput:
    type: object
    required: [tools, next_action]
    properties:
      tools:
        type: array
        description: Ranked tool candidates with enough context to choose which one to inspect.
        items: { $ref: "../../common/RobotToolCatalogueItem.yaml" }
      next_action:
        type: string
        description: Recommended next step for inspecting and activating a selected candidate.
    additionalProperties: false
