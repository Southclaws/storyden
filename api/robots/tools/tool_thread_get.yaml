$schema: http://json-schema.org/draft-07/schema#
$id: ToolThreadGet
x-storyden-tool:
  toolsets:
    - system.discussions
  title: Get Thread
  role: READ_PUBLISHED_THREADS
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
title: thread_get
description: Retrieve discussion thread metadata by ID and indicate how to inspect its document when needed.
type: object
required:
  - input
  - output
properties:
  input:
    $ref: "#/definitions/ToolThreadGetInput"
  output:
    $ref: "#/definitions/ToolThreadGetOutput"
definitions:
  ToolThreadGetInput:
    type: object
    required:
      - id
    properties:
      id:
        type: string
        minLength: 1
        description: The unique identifier of the thread to retrieve
      page:
        type: integer
        minimum: 1
        description: "Page number for replies (default: 1)"
    additionalProperties: false
  ToolThreadGetOutput:
    type: object
    required:
      - id
      - slug
      - title
      - visibility
      - author
      - category
      - tags
      - created_at
      - browser_url
    properties:
      browser_url:
        type: string
        description: Browser URL for this resource. Always present this as a Markdown link when showing results to the user.
      id:
        type: string
        description: Unique identifier for the thread
      slug:
        type: string
      title:
        type: string
      content:
        type: string
        description: Plain-text thread body included for external MCP callers.
      next_action:
        type: string
        description: Conditional instruction for a Robot to open this thread when it is relevant.
      visibility:
        type: string
      author:
        type: string
        description: Author handle
      category:
        type: string
        description: Category name
      tags:
        type: array
        items:
          type: string
      created_at:
        type: string
        description: Creation timestamp
      url:
        type: string
        description: Associated URL if present
    additionalProperties: false
