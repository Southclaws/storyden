$schema: http://json-schema.org/draft-07/schema#
$id: ToolLibraryPagesUpdate
x-storyden-tool:
  toolsets: [system.library]
  title: Update Library Pages
  role: MANAGE_LIBRARY
  annotations: { readOnlyHint: false, destructiveHint: false, idempotentHint: false, openWorldHint: false }
title: library_pages_update
description: >-
  Update up to 100 Library pages as one atomic batch. Omitted fields remain unchanged. Targets must identify distinct pages.
  Inputs and references are validated before writes. Page and tag mutations all commit or all roll back.
  Optional external link enrichment is best-effort and outside that transaction; link failures do not block pages.
  Results match input order. Validation errors identify inputs by their one-based position or ref.
  Repeated requests are not deduplicated. If a response is lost, inspect the Library before submitting again.
type: object
required: [input, output]
properties:
  input: { $ref: "#/definitions/ToolLibraryPagesUpdateInput" }
  output: { $ref: "#/definitions/ToolLibraryPagesUpdateOutput" }
definitions:
  ToolLibraryPagesUpdateInput:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        minItems: 1
        maxItems: 100
        items: { $ref: "#/definitions/ToolLibraryPagesUpdateItem" }
  ToolLibraryPagesUpdateItem:
    type: object
    additionalProperties: false
    required: [ref, id]
    properties:
      ref:
        type: string
        minLength: 1
        maxLength: 128
        description: Unique reference for matching this item to its result.
      id:
        type: string
        minLength: 1
        description: The unique identifier of the page to update
      name:
        type: string
        minLength: 1
        description: The new name/title of the page
      slug:
        type: string
        minLength: 1
        description: The new URL slug for the page
      content:
        type: string
        description: The new content of the page in HTML format
      visibility:
        type: string
        enum:
          - published
          - draft
        description: New visibility of the page
      url:
        type: string
        format: uri
        description: New external URL reference
      parent:
        type: string
        description: New parent page slug. Provide to move the page to a different parent.
      tags:
        type: array
        items:
          type: string
        description: Replacement tag names. Missing tags are created automatically. Omit to preserve tags; pass an empty array to remove all tags.
  ToolLibraryPagesUpdateOutput:
    type: object
    additionalProperties: false
    required: [results, next_action]
    properties:
      results:
        type: array
        items: { $ref: "../../common/LibraryPageBatchResult.yaml" }
      next_action:
        type: string
