$schema: http://json-schema.org/draft-07/schema#
$id: ToolToolsetList
x-storyden-tool:
  toolsets:
    - system.robot_studio
  title: List Toolsets
  role: USE_ROBOTS
  annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }
title: toolset_list
description: List reusable system, custom, and plugin Toolsets.
type: object
required: [input, output]
properties:
  input: { $ref: "#/definitions/ToolToolsetListInput" }
  output: { $ref: "#/definitions/ToolToolsetListOutput" }
definitions:
  ToolToolsetListInput:
    type: object
    additionalProperties: false
  ToolToolsetListOutput:
    type: object
    required: [toolsets]
    properties:
      toolsets:
        type: array
        items: { $ref: "../../common/RobotToolsetCatalogueItem.yaml" }
    additionalProperties: false
