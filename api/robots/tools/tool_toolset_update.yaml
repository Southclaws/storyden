$schema: http://json-schema.org/draft-07/schema#
$id: ToolToolsetUpdate
x-storyden:
  toolsets:
    - system.robot_studio
x-storyden-tool:
  title: Update Toolset
  role: USE_ROBOTS
  annotations: { readOnlyHint: false, destructiveHint: false, idempotentHint: true, openWorldHint: false }
title: toolset_update
description: Update an authored custom Toolset. System and plugin Toolsets are read-only.
type: object
required: [input, output]
properties:
  input: { $ref: "#/definitions/ToolToolsetUpdateInput" }
  output: { $ref: "#/definitions/ToolToolsetUpdateOutput" }
definitions:
  ToolToolsetUpdateInput:
    type: object
    required: [id]
    properties:
      id: { type: string, pattern: "^[0-9a-v]{20}$" }
      name: { type: string, minLength: 1 }
      description: { type: string }
      instruction: { type: string }
      tools:
        type: array
        items: { type: string }
    additionalProperties: false
  ToolToolsetUpdateOutput:
    type: object
    required: [id, name]
    properties:
      id: { type: string }
      name: { type: string }
    additionalProperties: false
