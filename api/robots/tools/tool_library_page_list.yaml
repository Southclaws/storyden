$schema: http://json-schema.org/draft-07/schema#
$id: ToolLibraryPageTree
x-storyden-tool:
  toolsets:
    - system.library
  title: List Library Pages
  role: READ_PUBLISHED_LIBRARY
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: false
    openWorldHint: false
title: library_page_list
description: List Library pages with hierarchy, visibility, creation-time filters and pagination. Use sort newest for the most recently created pages. Filters apply before pagination; chronological sorting ignores the manual tree order.
type: object
required:
  - input
  - output
properties:
  input:
    $ref: "#/definitions/ToolLibraryPageTreeInput"
  output:
    $ref: "#/definitions/ToolLibraryPageTreeOutput"
definitions:
  ToolLibraryPageTreeInput:
    type: object
    properties:
      page:
        type: integer
        minimum: 1
        description: "Page number (default: 1)."
      page_size:
        type: integer
        minimum: 1
        maximum: 100
        description: "Pages per result (default: 10)."
      sort:
        type: string
        enum: [hierarchy, newest, oldest]
        description: "hierarchy preserves the Library tree order (default). newest and oldest order by original creation time, ignoring manual positions and edits."
      created_since:
        type: string
        format: date-time
        description: Inclusive lower bound on original page creation time (RFC 3339), not edits or publication time.
      created_before:
        type: string
        format: date-time
        description: Exclusive upper bound on page creation time (RFC 3339). Keep the same bounds when fetching subsequent pages.
      depth:
        type: integer
        minimum: -1
        description: Maximum depth to traverse (-1 for unlimited, 0 for root only, 1 for
          root + children, etc.)
      visibility:
        type: string
        enum:
          - draft
          - review
          - published
        description: Limit pages to one workflow visibility.
    additionalProperties: false
  ToolLibraryPageTreeOutput:
    type: object
    required:
      - pages
      - results
      - current_page
      - total_pages
      - total_results
    properties:
      pages:
        type: array
        description: Matching pages in the requested order for selecting a page to inspect.
        items:
          $ref: "#/definitions/LibraryPageTreeNode"
      current_page:
        type: integer
      total_pages:
        type: integer
      total_results:
        type: integer
        description: Total matching pages across all result pages.
      next_page:
        type: integer
        description: Next result page number if available.
      created_since:
        type: string
        format: date-time
        description: Effective inclusive creation-time lower bound, when filtering by date.
      created_before:
        type: string
        format: date-time
        description: Effective exclusive creation-time upper bound, when filtering by date.
      results:
        type: integer
        description: Number of pages returned.
    additionalProperties: false
  LibraryPageTreeNode:
    type: object
    required:
      - id
      - slug
      - name
      - description
      - browser_url
      - visibility
      - created_at
      - updated_at
    properties:
      created_at:
        type: string
        format: date-time
        description: Original page creation time, not publication time.
      updated_at:
        type: string
        format: date-time
        description: Last update time of the page.
      browser_url:
        type: string
        description: Browser URL for this resource. Always present this as a Markdown link when showing results to the user.
      id:
        type: string
        description: Unique identifier for the page
      slug:
        type: string
        description: URL-friendly identifier for the page
      name:
        type: string
        description: Display name of the page
      description:
        type: string
        description: Brief description of the page
      parent:
        type: string
        description: Slug of the parent page (omitted for root pages)
      tags:
        type: array
        description: Tags associated with this page
        items:
          type: string
      visibility:
        type: string
        enum:
          - draft
          - review
          - published
        description: Current publishing workflow state.
    additionalProperties: false
