$schema: http://json-schema.org/draft-07/schema#
$id: ToolTrailGet
x-storyden:
  toolsets:
    - system.trails
x-storyden-tool:
  title: Get Trail
  role: MANAGE_TRAILS
  annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }
title: trail_get
description: Retrieve a Trail by its ID.
type: object
required: [input, output]
properties:
  input: { $ref: "#/definitions/ToolTrailGetInput" }
  output: { $ref: "#/definitions/ToolTrailGetOutput" }
definitions:
  ToolTrailGetInput:
    type: object
    required: [trail_id]
    additionalProperties: false
    properties:
      trail_id:
        type: string
        pattern: '^[0-9a-v]{20}$'
        description: Trail identifier returned by trail_list or trail_create.
  ToolTrailGetOutput:
    type: object
    required: [trail]
    additionalProperties: false
    properties:
      trail:
        $ref: "../../common/TrailToolItem.yaml"
