$schema: http://json-schema.org/draft-07/schema#
$id: ToolToolsetLoad
x-storyden:
  toolsets: []
x-storyden-tool:
  title: Load Toolsets
  annotations: { readOnlyHint: false, destructiveHint: false, idempotentHint: true, openWorldHint: false }
title: toolset_load
description: Activate reusable Toolsets for the current Robot conversation after inspecting their contents and runtime preconditions with toolset_get. Workspace-dependent Toolsets cannot be loaded until the conversation has an active workspace.
type: object
required: [input, output]
properties:
  input: { $ref: "#/definitions/ToolToolsetLoadInput" }
  output: { $ref: "#/definitions/ToolToolsetLoadOutput" }
definitions:
  ToolToolsetLoadInput:
    type: object
    required: [toolsets]
    properties:
      toolsets:
        type: array
        minItems: 1
        items: { type: string }
        description: Toolset IDs inspected with toolset_get.
    additionalProperties: false
  ToolToolsetLoadOutput:
    type: object
    required: [loaded, next_action]
    properties:
      loaded:
        type: array
        description: Toolsets activated for subsequent model steps in this conversation.
        items: { $ref: "../../common/RobotToolsetCatalogueItem.yaml" }
      next_action:
        type: string
        description: Recommended continuation now that the selected Toolsets and their guidance are active.
    additionalProperties: false
