$schema: http://json-schema.org/draft-07/schema#
$id: ToolThreadList
x-storyden-tool:
  toolsets:
    - system.discussions
  title: List Threads
  role: READ_PUBLISHED_THREADS
  annotations:
    readOnlyHint: true
    destructiveHint: false
    idempotentHint: false
    openWorldHint: false
title: thread_list
description: List and search discussion threads with filtering and pagination. Use sort newest to retrieve the most recently created discussions, and created_since/created_before for a specific time range. Dates are filtered by the server before pagination; pinned threads do not override explicit chronological sorting.
type: object
required:
  - input
  - output
properties:
  input:
    $ref: "#/definitions/ToolThreadListInput"
  output:
    $ref: "#/definitions/ToolThreadListOutput"
definitions:
  ToolThreadListInput:
    type: object
    properties:
      query:
        type: string
        description: Search query to filter threads
      visibility:
        type: string
        enum:
          - draft
          - published
        description: Filter by visibility
      page:
        type: integer
        minimum: 1
        description: "Page number (default: 1)"
      page_size:
        type: integer
        minimum: 1
        maximum: 100
        description: "Threads per page (default: 10)."
      sort:
        type: string
        enum: [activity, newest, oldest]
        description: "activity preserves the normal feed order with pinned threads first (default). newest and oldest order by creation time, ignoring pins and replies."
      created_since:
        type: string
        format: date-time
        description: "Inclusive lower bound on thread creation time (RFC 3339). Filters original thread creation, not edits, replies or publication time."
      created_before:
        type: string
        format: date-time
        description: "Exclusive upper bound on thread creation time (RFC 3339). Keep the same bounds when fetching subsequent pages."
    additionalProperties: false
  ToolThreadListOutput:
    type: object
    required:
      - threads
      - current_page
      - total_pages
      - total_results
    properties:
      threads:
        type: array
        items:
          $ref: "#/definitions/ThreadSummary"
      current_page:
        type: integer
      total_pages:
        type: integer
      total_results:
        type: integer
        description: Total matching threads across all pages.
      created_since:
        type: string
        format: date-time
        description: Effective inclusive creation-time lower bound, when filtering by date.
      created_before:
        type: string
        format: date-time
        description: Effective exclusive creation-time upper bound, when filtering by date.
      next_page:
        type: integer
        description: Next page number if available
    additionalProperties: false
  ThreadSummary:
    type: object
    required:
      - id
      - slug
      - title
      - excerpt
      - author
      - category
      - browser_url
      - created_at
      - updated_at
    properties:
      browser_url:
        type: string
        description: Browser URL for this resource. Always present this as a Markdown link when showing results to the user.
      id:
        type: string
        description: Unique identifier for the thread
      slug:
        type: string
      title:
        type: string
      excerpt:
        type: string
        description: Short excerpt of the thread
      author:
        type: string
        description: Author handle
      category:
        type: string
        description: Category name
      created_at:
        type: string
        format: date-time
        description: Original thread creation time, not publication or last reply time.
      updated_at:
        type: string
        format: date-time
        description: Last update time of the thread.
    additionalProperties: false
