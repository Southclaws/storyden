$schema: http://json-schema.org/draft-07/schema#
$id: ToolThreadOpen
x-storyden:
  internal: true
  toolsets:
    - system.discussions
x-storyden-tool:
  title: Open Thread
  role: READ_PUBLISHED_THREADS
  annotations: { readOnlyHint: false, destructiveHint: false, idempotentHint: true, openWorldHint: false }
title: thread_open
description: Open a discussion thread and all currently visible replies as one active document snapshot, then return its initial bounded projection.
type: object
required: [input, output]
properties:
  input: { $ref: "#/definitions/ToolThreadOpenInput" }
  output: { $ref: "#/definitions/ToolThreadOpenOutput" }
definitions:
  ToolThreadOpenInput:
    type: object
    required: [id]
    properties:
      id:
        type: string
        minLength: 1
        description: Thread ID or slug returned by discussion discovery tools.
    additionalProperties: false
  ToolThreadOpenOutput:
    $ref: "../../common/RobotDocumentProjection.yaml"
