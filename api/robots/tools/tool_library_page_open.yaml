$schema: http://json-schema.org/draft-07/schema#
$id: ToolLibraryPageOpen
x-storyden-tool:
  internal: true
  toolsets:
    - system.library
  title: Open Library Page
  role: READ_PUBLISHED_LIBRARY
  annotations: { readOnlyHint: false, destructiveHint: false, idempotentHint: true, openWorldHint: false }
title: library_page_open
description: Open a Library page as the active document snapshot and return its initial bounded projection.
type: object
required: [input, output]
properties:
  input: { $ref: "#/definitions/ToolLibraryPageOpenInput" }
  output: { $ref: "#/definitions/ToolLibraryPageOpenOutput" }
definitions:
  ToolLibraryPageOpenInput:
    type: object
    required: [id]
    properties:
      id:
        type: string
        minLength: 1
        description: >-
          Library page (node) ID or slug supplied by the user or a tool result.
          For the page referenced by invocation context, use datagraph_item.id or datagraph_item.slug when datagraph_item.kind is "node".
    additionalProperties: false
  ToolLibraryPageOpenOutput:
    $ref: "../../common/RobotDocumentProjection.yaml"
