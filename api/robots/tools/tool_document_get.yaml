$schema: http://json-schema.org/draft-07/schema#
$id: ToolDocumentGet
x-storyden-tool:
  internal: true
  toolset_only: true
  toolsets:
    - system.documents
  title: Inspect Document
  annotations: { readOnlyHint: false, destructiveHint: false, idempotentHint: true, openWorldHint: false }
title: document_get
description: Inspect one structural page of the active document or a specified location and make it the current document cursor.
type: object
required: [input, output]
properties:
  input: { $ref: "#/definitions/ToolDocumentGetInput" }
  output: { $ref: "#/definitions/ToolDocumentGetOutput" }
definitions:
  ToolDocumentGetInput:
    type: object
    properties:
      document_id:
        type: string
        description: Open document identifier; omit to inspect the active document.
      node_id:
        type: string
        description: Structural location returned by an outline or search result; omit to continue from that document's current node.
      page:
        type: integer
        minimum: 1
        description: One-indexed structural page to inspect; omit to retain the current page when node_id is also omitted, or use the first page of a specified node.
    additionalProperties: false
  ToolDocumentGetOutput:
    $ref: "../../common/RobotDocumentProjection.yaml"
