$schema: http://json-schema.org/draft-07/schema#
$id: ToolTrailSchedulePreview
x-storyden-tool:
  toolsets:
    - system.trails
  title: Preview Trail Schedule
  role: MANAGE_TRAILS
  annotations: { readOnlyHint: true, destructiveHint: false, idempotentHint: true, openWorldHint: false }
title: trail_schedule_preview
description: Preview the next occurrences of a Trail schedule.
type: object
required: [input, output]
properties:
  input: { $ref: "#/definitions/ToolTrailSchedulePreviewInput" }
  output: { $ref: "#/definitions/ToolTrailSchedulePreviewOutput" }
definitions:
  ToolTrailSchedulePreviewInput:
    type: object
    required: [schedule]
    additionalProperties: false
    properties:
      schedule:
        $ref: "../../common/TrailToolSchedule.yaml"
      after:
        type: string
        format: date-time
        description: UTC instant after which occurrences are calculated; omit to use the current time.
  ToolTrailSchedulePreviewOutput:
    type: object
    required: [occurrences]
    additionalProperties: false
    properties:
      occurrences:
        type: array
        description: Next schedule occurrences in UTC.
        items:
          type: string
          format: date-time
