$schema: http://json-schema.org/draft-07/schema#
type: object
description: >-
  A tool candidate returned by capability discovery. Use id with tool_get to inspect
  its schema and preconditions before choosing or loading it. When availability is
  callable, invoke callable_name with the inspected arguments. When load_required,
  activate the ID with tool_load and use it on the next model step; tools marked
  toolset_only by tool_get require toolset_get and toolset_load for a declared Toolset
  instead. When blocked, inspect the preconditions with tool_get and, when available,
  tool_runtime_issues for initialization failures before attempting activation.
  Inspection alone does not activate a tool.
required: [id, callable_name, name, description]
additionalProperties: false
properties:
  id:
    type: string
    description: Stable tool identifier accepted by tool_get, tool_load, and Robot configuration tools.
  callable_name:
    type: string
    description: Exact function name to invoke when callable; may differ from the stable ID.
  name:
    type: string
    description: Human-readable tool title that helps distinguish similar capabilities.
  description:
    type: string
    description: The outcome this tool can achieve, used to decide whether its full schema is worth inspecting.
  availability:
    $ref: "./RobotToolAvailability.yaml"
