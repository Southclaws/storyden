      commands:
      - name: list
        operationId: apiAdminOAuthRefreshTokenList
        description: List OAuth refresh tokens.
        flags:
        - name: page
          description: Pagination query parameters.
          trackChanged: true
        - $ref: '#/components/flags/api-output'
        - $ref: '#/components/flags/api-output-file'
        - $ref: '#/components/flags/api-timeout'
        longDescription: |
          # List OAuth refresh tokens

          List OAuth refresh tokens.

          Refresh tokens are account-owned grants for an OAuth client. Revoking
          a refresh token prevents future token renewal, but does not
          immediately invalidate already-issued JWT access tokens.

          Rotation writes a new row per refresh, so this table grows with usage
          and the response is paginated.


          Inspect the local request and response contract with `sd api schema
          AdminOAuthRefreshTokenList`. This calls `GET
          /admin/oauth/refresh-tokens` using the selected account. The server
          enforces permissions.

          ## Output and automation

