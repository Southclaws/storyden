      commands:
      - name: list
        operationId: apiOAuthClientList
        description: List OAuth clients created by the authenticated account.
        flags:
        - $ref: '#/components/flags/api-output'
        - $ref: '#/components/flags/api-output-file'
        - $ref: '#/components/flags/api-timeout'
        longDescription: |
          # List OAuth clients created by the authenticated account

          List OAuth clients created by the authenticated account.

          This is the member-facing "apps I created" view. OAuth clients are
          application definitions: client ID, client type, redirect URIs,
          allowed scopes, and allowed grants.

          This does not list built-in first-party clients or third-party apps
          the member has merely authorised. Use `/auth/oauth/tokens` for the
          "apps I have authorised" view.


          Inspect the local request and response contract with `sd api schema
          OAuthClientList`. This calls `GET /auth/oauth/clients` using the
          selected account. The server enforces permissions.

          ## Output and automation

          The default `--output json` preserves the complete server response,
          including nested fields and pagination metadata. Empty responses print
          `null`; HEAD responses contain `status` and `headers`. Errors go to
          stderr and return a nonzero exit status. This command sends one
          request; it does not automatically traverse pages or cursors.
        examples:
        - command: sd account oauth clients list
      - name: create
        operationId: apiOAuthClientCreate
        description: Create an OAuth client owned by the authenticated account.
        flags:
        - $ref: '#/components/flags/api-data'
        - $ref: '#/components/flags/api-file'
        - $ref: '#/components/flags/api-content-type'
        - $ref: '#/components/flags/api-output'
        - $ref: '#/components/flags/api-output-file'
        - $ref: '#/components/flags/api-timeout'
        longDescription: |
          # Create an OAuth client owned by the authenticated account

          Create an OAuth client owned by the authenticated account.

          Member-created clients are third-party explicit-scope clients. The
          requested allowed scopes must be a subset of the authenticated
          account's current permissions.

          ## Request body

          Send JSON using `--file payload.json`, `--file -`, or `--data`.
          Top-level fields:

          - `name` (string, required).
          - `type` (string, required): `public`, `confidential`.
          - `redirect_uris` (array).
          - `allowed_scopes` (array, required).
          - `allowed_grants` (array, required).
          - `pkce_required` (boolean, required).

          Inspect the local request and response contract with `sd api schema
          OAuthClientCreate`. This calls `POST /auth/oauth/clients` using the
          selected account. The server enforces permissions. The request
          executes immediately; this is not a dry run. After an uncertain
          network failure, inspect current state before retrying a mutation.

