  - name: roles
    description: Assign account roles and choose profile badges.
    longDescription: |
      # Account Roles

      Assign or remove roles on a target account, and set or remove its
      displayed role badge. Use role list for role IDs; each operation still
      requires the appropriate server permissions.

      Commands send one request and return the full JSON response by default.
      Use explicit IDs from list/get output and `--context NAME` for automation.
      Mutations apply immediately; check current state before retrying after a
      network failure.

      ## Examples

      ~~~sh
      sd account roles add --help
      ~~~
    commands:
    - name: add
      operationId: apiAccountAddRole
      description: Adds a role to an account.
      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: ROLE_ID
        description: Role ID
        required: true
      - name: ACCOUNT_HANDLE
        description: Account handle.
        required: true
      longDescription: |
        # Adds a role to an account

        Adds a role to an account. Members without the MANAGE_ROLES permission
        cannot use this operation.


        Inspect the local request and response contract with `sd api schema
        AccountAddRole`. This calls `PUT
        /accounts/{account_handle}/roles/{role_id}` using the selected account.
        The server enforces permissions. The request executes immediately; this
        is not a dry run. After an uncertain network failure, inspect current
        state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd account roles add ROLE_ID HANDLE
    - name: remove
      operationId: apiAccountRemoveRole
      description: Removes a role from an account.
      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: ROLE_ID
        description: Role ID
        required: true
      - name: ACCOUNT_HANDLE
        description: Account handle.
        required: true
      longDescription: |
        # Removes a role from an account

        Removes a role from an account. Members without the MANAGE_ROLES cannot
        use this operation. Admins cannot remove the admin role from themselves.


        Inspect the local request and response contract with `sd api schema
        AccountRemoveRole`. This calls `DELETE
        /accounts/{account_handle}/roles/{role_id}` using the selected account.
        The server enforces permissions. The request executes immediately; this
        is not a dry run. After an uncertain network failure, inspect current
        state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd account roles remove ROLE_ID HANDLE
    - name: badge-set
      operationId: apiAccountRoleSetBadge
      description: Desgiantes the specified role as a badge for the profile.
      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: ROLE_ID
        description: Role ID
        required: true
      - name: ACCOUNT_HANDLE
        description: Account handle.
        required: true
      longDescription: |
        # Desgiantes the specified role as a badge for the profile

        Desgiantes the specified role as a badge for the profile. Only one role
        may be set as a badge for the profile. Setting a role as a badge is
        entirely aesthetic and does not grant any additional permissions. Roles
        may be created without any permissions in order to be used as badges.


        Inspect the local request and response contract with `sd api schema
        AccountRoleSetBadge`. This calls `PUT
        /accounts/{account_handle}/roles/{role_id}/badge` using the selected
        account. The server enforces permissions. The request executes
        immediately; this is not a dry run. After an uncertain network failure,
        inspect current state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd account roles badge-set ROLE_ID HANDLE
    - name: badge-remove
      operationId: apiAccountRoleRemoveBadge
      description: Removes the badge from the profile.
      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: ROLE_ID
        description: Role ID
        required: true
      - name: ACCOUNT_HANDLE
        description: Account handle.
        required: true
      longDescription: |
        # Removes the badge from the profile

        Removes the badge from the profile. This does not remove the role from
        the account, only the visual badge-status representation of the role.


        Inspect the local request and response contract with `sd api schema
        AccountRoleRemoveBadge`. This calls `DELETE
        /accounts/{account_handle}/roles/{role_id}/badge` using the selected
        account. The server enforces permissions. The request executes
        immediately; this is not a dry run. After an uncertain network failure,
        inspect current state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd account roles badge-remove ROLE_ID HANDLE
  - name: access-keys
    description: Create, inspect, and revoke your account’s access keys.
    longDescription: |
      # Account Access-Keys

      List, create, and revoke static access keys for the selected account.
      Preserve the secret returned when creating a key. A key can be used with
      auth login --access-key-stdin.

      Commands send one request and return the full JSON response by default.
      Use explicit IDs from list/get output and `--context NAME` for automation.
      Mutations apply immediately; check current state before retrying after a
      network failure.

      ## Examples

      ~~~sh
      sd account access-keys list --help
      ~~~
    commands:
    - name: list
      operationId: apiAccessKeyList
      description: Access Key List.
      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      longDescription: |
        # Access Key List

        List all access keys for the authenticated account or all access keys
        that have been issued for the entire instance if and only if the request
        parameters specify all keys and the requesting account is an admin.


        Inspect the local request and response contract with `sd api schema
        AccessKeyList`. This calls `GET /auth/access-keys` using the selected
        account. The server enforces permissions.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd account access-keys list
    - name: create
      operationId: apiAccessKeyCreate
      description: Create a new access key for the authenticated account.
      flags:
      - $ref: '#/components/flags/api-data'
      - $ref: '#/components/flags/api-file'
      - $ref: '#/components/flags/api-content-type'
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      longDescription: |
        # Create a new access key for the authenticated account

        Create a new access key for the authenticated account. Access keys are
        used to authenticate API requests on behalf of the account in a more
        granular and service-friendly way than a session cookie.

        Access keys share the same roles and permissions as the owning account
        and only provide a way to use an `Authorization` header as an way of
        interacting with the Storyden API.

        Access keys also allow an expiry date to be set to limit how long a key
        can be used to authenticate against the API.

        ## Request body

        Send JSON using `--file payload.json`, `--file -`, or `--data`.
        Top-level fields:

        - `name` (string, required).
        - `expires_at` (string).

        Inspect the local request and response contract with `sd api schema
        AccessKeyCreate`. This calls `POST /auth/access-keys` using the selected
        account. The server enforces permissions. The request executes
        immediately; this is not a dry run. After an uncertain network failure,
        inspect current state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd account access-keys create --file payload.json
    - name: delete
      operationId: apiAccessKeyDelete
      description: Revoke an access key.
      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: ACCESS_KEY_ID
        description: Access key ID.
        required: true
      longDescription: |
        # Revoke an access key

        Revoke an access key. This will immediately invalidate the key and it
        will no longer be usable for authentication.


        Inspect the local request and response contract with `sd api schema
        AccessKeyDelete`. This calls `DELETE /auth/access-keys/{access_key_id}`
        using the selected account. The server enforces permissions. The request
        executes immediately; this is not a dry run. After an uncertain network
        failure, inspect current state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd account access-keys delete ACCESS_KEY_ID
  - name: oauth
    description: Manage your account’s OAuth clients and refresh tokens.
    longDescription: |
      # Account Oauth

      Manage OAuth clients and refresh tokens belonging to the selected account.
      Instance-wide administration is under admin oauth.

      Commands send one request and return the full JSON response by default.
      Use explicit IDs from list/get output and `--context NAME` for automation.
      Mutations apply immediately; check current state before retrying after a
      network failure.

      ## Examples

      ~~~sh
      sd account oauth tokens --help
      ~~~
    commands:
    - name: tokens
      description: Inspect and revoke your account’s OAuth refresh tokens.
      longDescription: |
        # Account Oauth Tokens

        Inspect and revoke the selected account’s OAuth refresh tokens.
        Revocation prevents subsequent refreshes; it does not necessarily
        invalidate already issued access tokens immediately.

        Commands send one request and return the full JSON response by default.
        Use explicit IDs from list/get output and `--context NAME` for
        automation. Mutations apply immediately; check current state before
        retrying after a network failure.

        ## Examples

        ~~~sh
        sd account oauth tokens list --help
        ~~~
      commands:
      - name: list
        operationId: apiOAuthRefreshTokenList
        description: >-
          List OAuth refresh tokens issued to the authenticated account.
        flags:
        - name: page
          description: Pagination query parameters.
          trackChanged: true
        - $ref: '#/components/flags/api-output'
        - $ref: '#/components/flags/api-output-file'
        - $ref: '#/components/flags/api-timeout'
        longDescription: |
          # List OAuth refresh tokens issued to the authenticated account

          List OAuth refresh tokens issued to the authenticated account.

          This is the member-facing "authorised applications" view: it lists
          apps the signed-in account has authorised and can revoke. In OAuth
          terms, these rows are grants/tokens, not application definitions.

          This may include grants for built-in first-party clients such as the
          default Storyden CLI. Those clients are not created by the member and
          therefore do not appear in the member OAuth client list.


          Inspect the local request and response contract with `sd api schema
          OAuthRefreshTokenList`. This calls `GET /auth/oauth/tokens` using the
          selected account. The server enforces permissions.

          ## Output and automation

          The default `--output json` preserves the complete server response,
          including nested fields and pagination metadata. Empty responses print
          `null`; HEAD responses contain `status` and `headers`. Errors go to
          stderr and return a nonzero exit status. This command fetches one
          page; pass `--page` explicitly to continue according to response
          pagination metadata.
        examples:
        - command: sd account oauth tokens list
      - name: delete
        operationId: apiOAuthRefreshTokenDelete
        description: >-
          Revoke one OAuth refresh token issued to the authenticated account.
        flags:
        - $ref: '#/components/flags/api-output'
        - $ref: '#/components/flags/api-output-file'
        - $ref: '#/components/flags/api-timeout'
        arguments:
        - name: OAUTH_REFRESH_TOKEN_ID
          description: OAuth refresh token ID.
          required: true
        longDescription: |
          # Revoke one OAuth refresh token issued to the authenticated account

          Revoke one OAuth refresh token issued to the authenticated account.

          This prevents future refresh-token use for the selected grant.
          Existing JWT access tokens remain valid until their expiry.


          Inspect the local request and response contract with `sd api schema
          OAuthRefreshTokenDelete`. This calls `DELETE
          /auth/oauth/tokens/{oauth_refresh_token_id}` using the selected
          account. The server enforces permissions. The request executes
          immediately; this is not a dry run. After an uncertain network
          failure, inspect current state before retrying a mutation.

          ## Output and automation

          The default `--output json` preserves the complete server response,
          including nested fields and pagination metadata. Empty responses print
          `null`; HEAD responses contain `status` and `headers`. Errors go to
          stderr and return a nonzero exit status. This command sends one
          request; it does not automatically traverse pages or cursors.
        examples:
        - command: sd account oauth tokens delete OAUTH_REFRESH_TOKEN_ID
    - name: clients
      description: Register and configure OAuth clients owned by your account.
      longDescription: |
        # Account Oauth Clients

        Create, inspect, update, and delete OAuth client registrations belonging
        to the selected account. Consult each operation’s schema for allowed
        redirect URIs, scopes, and authentication settings.

        Commands send one request and return the full JSON response by default.
        Use explicit IDs from list/get output and `--context NAME` for
        automation. Mutations apply immediately; check current state before
        retrying after a network failure.

        ## Examples

