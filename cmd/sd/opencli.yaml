- name: account
  description: Update your profile, credentials, email addresses, and roles.
  longDescription: |
    # Account

    Manage your own account, credentials, email addresses, and OAuth clients.
    Role assignment targets the supplied account handle and requires the server
    permissions for that operation. `account get` identifies the selected
    account; use `admin accounts` for administrative account management.

    Commands send one request and return the full JSON response by default. Use
    explicit IDs from list/get output and `--context NAME` for automation.
    Mutations apply immediately; check current state before retrying after a
    network failure.

    ## Examples

    ~~~sh
    sd account get --help
    ~~~
