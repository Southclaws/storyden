    description: >-
      Read instance configuration and update stored community settings.
    longDescription: |
      # Admin Settings

      Read instance configuration and update stored community settings such as
      branding, authentication policy, service options, and layout metadata.
      Environment-derived configuration is visible to administrators but must be
      changed in the deployment. Read the current settings before updating
      nested values; settings responses may contain secrets.

      Commands send one request and return the full JSON response by default.
      Use explicit IDs from list/get output and `--context NAME` for automation.
      Mutations apply immediately; check current state before retrying after a
      network failure.

      ## Examples

      ~~~sh
      sd admin settings get --help
      ~~~
    commands:
    - name: get
      operationId: apiAdminSettingsGet
      description: Retrieve all configuration settings for installation.
      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      longDescription: |
        # Retrieve all configuration settings for installation

        Retrieve all configuration settings for installation. This includes the
        publicly accessible information for the instance as well as admin-only
        access to sensitive configuration (environment variables) and settings.


        Inspect the local request and response contract with `sd api schema
        AdminSettingsGet`. This calls `GET /admin` using the selected account.
        The server enforces permissions.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd admin settings get
    - name: update
      operationId: apiAdminSettingsUpdate
      description: Update non-env configuration settings for installation.
      flags:
      - $ref: '#/components/flags/api-data'
      - $ref: '#/components/flags/api-file'
      - $ref: '#/components/flags/api-content-type'
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      longDescription: |
        # Update non-env configuration settings for installation

        Update non-env configuration settings for installation.

        ## Request body

        Send JSON using `--file payload.json`, `--file -`, or `--data`.
        Top-level fields:

        - `title` (string).
        - `description` (string).
        - `content` (string).
        - `accent_colour` (string).
        - `authentication_mode` (string): `handle`, `email`, `phone`.
        - `registration_mode` (string): `public`, `invitation`, `disabled`.
        - `services` (object).
        - `metadata` (object).
        - `motd` (object).

        Inspect the local request and response contract with `sd api schema
        AdminSettingsUpdate`. This calls `PATCH /admin` using the selected
        account. The server enforces permissions. The request executes
        immediately; this is not a dry run. After an uncertain network failure,
        inspect current state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors. Read `admin
        settings get` first. This updates database-backed settings; deployment
        environment variables remain read-only through this API. Nested settings
        can have replacement semantics: send the complete nested value you
        intend to retain.
      examples:
      - command: sd admin settings update --file payload.json
