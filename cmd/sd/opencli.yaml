  - name: chat
    operationId: robotChat
    description: Submit a text message to a new or existing Robot session.
    longDescription: |
      # Send a message to a Robot

      Submit one user message. Without --session, the CLI generates a new
      session ID. Use --robot to select the root Robot for a new session; omit
      it to use Denbot. An existing session retains its root Robot. Discover
      Robot IDs with `robot list`.

      The JSON response acknowledges queued input; it is not a completed answer.
      Read persisted events with `robot sessions events SESSION_ID`, or follow
      with `--live sse --output raw --timeout 0s`. Use `robot sessions get` for
      history and `robot sessions turns cancel` to cancel an active turn.
      Disconnecting a stream only stops reading. Robots may execute tools and
      change community data.

      Use --message-file - to read a prompt from stdin. For attachments,
      workspace mounts, context, or tool confirmations, use `robot sessions
      submit --file` and inspect `sd api schema RobotSessionCreate` for its JSON
      request shape.
    arguments:
    - name: MESSAGE
      description: Text prompt; omit when using --message-file.
      required: false
    flags:
    - name: session
      description: Existing session XID; omit to create a new session.
    - name: robot
      description: Root Robot ID for a new session; omitted uses Denbot.
    - name: message-file
      description: Read the prompt from a UTF-8 file; - reads stdin.
    - name: output
      short: o
      description: 'Response format: json (default) or raw.'
      default: json
      choices:
      - json
      - raw
    - name: timeout
      description: Request timeout, such as 60s; 0s disables the deadline.
      default: 60s
    examples:
    - command: sd robot chat 'Summarise the latest discussions' --output json
    - command: sd robot chat --session SESSION_ID --message-file prompt.txt
- name: trail
  description: Schedule automation and inspect Trail runs.
  longDescription: |
    # Trail

    Trails schedule actions such as Robot runs. Use `preview` to inspect a
    schedule, `create` to save a definition, and `runs start` to trigger a
    manual occurrence. `update` requires the complete mutable definition: name,
    status, trigger, actions, and any description to retain.

    Statuses accepted by mutations are active, paused, and archived. Archive
    retains history and does not cancel running actions. Inspect `runs get`,
    then use `runs cancel-action` to cancel a specific Robot action. The run
    list returns the latest 100 runs.

    Commands send one request and return the full JSON response by default. Use
    explicit IDs from list/get output and `--context NAME` for automation.
    Mutations apply immediately; check current state before retrying after a
    network failure.

    ## Examples

    ~~~sh
    sd trail list --help
    ~~~
  commands:
  - name: list
    operationId: apiTrailList
    description: List Trails.
    flags:
    - $ref: '#/components/flags/api-output'
    - $ref: '#/components/flags/api-output-file'
    - $ref: '#/components/flags/api-timeout'
    longDescription: |
      # List Trails

      Return all Trail definitions that the requesting account can manage. Each
      item includes its trigger, action bindings, lifecycle state, and latest
      occurrence times. Archived Trails remain in the result.


      Inspect the local request and response contract with `sd api schema
      TrailList`. This calls `GET /trails` using the selected account. The
      server enforces permissions.

      ## Output and automation

      The default `--output json` preserves the complete server response,
      including nested fields and pagination metadata. Empty responses print
      `null`; HEAD responses contain `status` and `headers`. Errors go to stderr
      and return a nonzero exit status. This command sends one request; it does
      not automatically traverse pages or cursors.
    examples:
    - command: sd trail list
  - name: create
    operationId: apiTrailCreate
    description: Create a Trail.
    flags:
    - $ref: '#/components/flags/api-data'
    - $ref: '#/components/flags/api-file'
    - $ref: '#/components/flags/api-content-type'
    - $ref: '#/components/flags/api-output'
    - $ref: '#/components/flags/api-output-file'
    - $ref: '#/components/flags/api-timeout'
    longDescription: |
      # Create a Trail

      Create a Trail with one trigger and one or more action bindings. The
      server records the requesting account as the creator and validates the
      trigger, actions, and lifecycle state. An active Trail receives its next
      occurrence when the trigger has a future occurrence.

      ## Request body

      Send JSON using `--file payload.json`, `--file -`, or `--data`. Top-level
      fields:

      - `name` (string, required).
      - `description` (string).
      - `status` (string, required): `active`, `paused`, `archived`.
      - `trigger` (value, required).
      - `actions` (array, required).

      Inspect the local request and response contract with `sd api schema
      TrailCreate`. This calls `POST /trails` using the selected account. The
      server enforces permissions. The request executes immediately; this is not
      a dry run. After an uncertain network failure, inspect current state
      before retrying a mutation.

      ## Output and automation

      The default `--output json` preserves the complete server response,
      including nested fields and pagination metadata. Empty responses print
      `null`; HEAD responses contain `status` and `headers`. Errors go to stderr
      and return a nonzero exit status. This command sends one request; it does
      not automatically traverse pages or cursors.
    examples:
    - command: sd trail create --file payload.json
  - name: get
    operationId: apiTrailGet
    description: Get a Trail.
    flags:
    - $ref: '#/components/flags/api-output'
    - $ref: '#/components/flags/api-output-file'
    - $ref: '#/components/flags/api-timeout'
    arguments:
    - name: TRAIL_ID
      description: trail id
      required: true
    longDescription: |
      # Get a Trail

      Return one Trail definition. The response includes the current trigger,
      active action bindings, lifecycle state, and occurrence times. The
      operation does not return run history.


      Inspect the local request and response contract with `sd api schema
      TrailGet`. This calls `GET /trails/{trail_id}` using the selected account.
      The server enforces permissions.

      ## Output and automation

      The default `--output json` preserves the complete server response,
      including nested fields and pagination metadata. Empty responses print
      `null`; HEAD responses contain `status` and `headers`. Errors go to stderr
      and return a nonzero exit status. This command sends one request; it does
      not automatically traverse pages or cursors.
    examples:
    - command: sd trail get TRAIL_ID
  - name: update
    operationId: apiTrailUpdate
    description: >-
      Replace a Trail definition to edit, pause, resume, or archive it.
    flags:
    - $ref: '#/components/flags/api-data'
    - $ref: '#/components/flags/api-file'
    - $ref: '#/components/flags/api-content-type'
    - $ref: '#/components/flags/api-output'
    - $ref: '#/components/flags/api-output-file'
    - $ref: '#/components/flags/api-timeout'
    arguments:
    - name: TRAIL_ID
      description: trail id
      required: true
    longDescription: |
      # Replace a Trail definition to edit, pause, resume, or archive it

      Replace the mutable Trail definition. The server validates the trigger and
      action bindings before it saves the update. The creator is immutable. A
      status change can pause, resume, or archive the Trail. Archive keeps
      existing run history and does not cancel action runs that already started.

      ## Request body

      Send JSON using `--file payload.json`, `--file -`, or `--data`. Top-level
      fields:

      - `name` (string, required).
      - `description` (string).
      - `status` (string, required): `active`, `paused`, `archived`.
      - `trigger` (value, required).
      - `actions` (array, required).

      Inspect the local request and response contract with `sd api schema
      TrailUpdate`. This calls `PATCH /trails/{trail_id}` using the selected
      account. The server enforces permissions. The request executes
      immediately; this is not a dry run. After an uncertain network failure,
      inspect current state before retrying a mutation.

      ## Output and automation

      The default `--output json` preserves the complete server response,
      including nested fields and pagination metadata. Empty responses print
      `null`; HEAD responses contain `status` and `headers`. Errors go to stderr
      and return a nonzero exit status. This command sends one request; it does
      not automatically traverse pages or cursors. This replaces the mutable
      definition; supply name, status, trigger, actions, and any description you
      want to retain. Archive does not cancel existing action runs.
    examples:
    - command: sd trail update TRAIL_ID --file payload.json
  - name: preview
    operationId: apiTrailSchedulePreview
    description: Preview the next five schedule occurrences.
    flags:
    - $ref: '#/components/flags/api-data'
    - $ref: '#/components/flags/api-file'
    - $ref: '#/components/flags/api-content-type'
    - $ref: '#/components/flags/api-output'
    - $ref: '#/components/flags/api-output-file'
    - $ref: '#/components/flags/api-timeout'
    longDescription: |
      # Preview the next five schedule occurrences

      Validate a schedule and return its next five occurrences after the
      supplied time. The operation does not create or update a Trail. The
      calculation skips local times that do not exist and emits an ambiguous
      local time once.

      ## Request body

      Send JSON using `--file payload.json`, `--file -`, or `--data`. Top-level
      fields:

      - `schedule` (object, required).
      - `after` (string).

      Inspect the local request and response contract with `sd api schema
      TrailSchedulePreview`. This calls `POST /trails/schedule/preview` using
      the selected account. The server enforces permissions. The request
      executes immediately; this is not a dry run. After an uncertain network
      failure, inspect current state before retrying a mutation.

      ## Output and automation

      The default `--output json` preserves the complete server response,
      including nested fields and pagination metadata. Empty responses print
      `null`; HEAD responses contain `status` and `headers`. Errors go to stderr
      and return a nonzero exit status. This command sends one request; it does
      not automatically traverse pages or cursors.
    examples:
    - command: sd trail preview --file payload.json
  - name: runs
    description: >-
      Start manual runs, inspect results, and cancel individual actions.
    longDescription: |
      # Trail Runs

      Inspect Trail occurrence history and action results or create a manual run
      without moving the schedule. Run history contains the latest 100 runs.
      cancel-action targets one queued/running Robot action; other actions in
      the run continue independently.

      Commands send one request and return the full JSON response by default.
      Use explicit IDs from list/get output and `--context NAME` for automation.
      Mutations apply immediately; check current state before retrying after a
      network failure.

      ## Examples

      ~~~sh
      sd trail runs list --help
      ~~~
    commands:
    - name: list
      operationId: apiTrailRunList
      description: List Trail run history.
      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: TRAIL_ID
        description: trail id
        required: true
      longDescription: |
        # List Trail run history

        Return the 100 most recent runs for one Trail. Each run contains an
        immutable trigger snapshot and the independent result of every action
        binding. The result includes scheduled, manual, and skipped runs.


        Inspect the local request and response contract with `sd api schema
        TrailRunList`. This calls `GET /trails/{trail_id}/runs` using the
        selected account. The server enforces permissions.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd trail runs list TRAIL_ID
    - name: start
      operationId: apiTrailRunNow
      description: Create a manual Trail occurrence without moving its schedule.
      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: TRAIL_ID
        description: trail id
        required: true
      longDescription: |
        # Create a manual Trail occurrence without moving its schedule

        Create a new manual run and its action runs immediately. The operation
        does not change the next scheduled occurrence. An archived Trail cannot
        start a manual run.


        Inspect the local request and response contract with `sd api schema
        TrailRunNow`. This calls `POST /trails/{trail_id}/runs` using the
        selected account. The server enforces permissions. The request executes
        immediately; this is not a dry run. After an uncertain network failure,
        inspect current state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd trail runs start TRAIL_ID
    - name: get
      operationId: apiTrailRunGet
      description: Get a Trail run and its independent action results.
      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: TRAIL_ID
        description: trail id
        required: true
      - name: RUN_ID
        description: run id
        required: true
      longDescription: |
        # Get a Trail run and its independent action results

        Return one Trail run and its action runs. The response contains the
        immutable trigger snapshot, aggregate status, action configuration
        snapshots, outputs, errors, and linked Robot resources.


        Inspect the local request and response contract with `sd api schema
        TrailRunGet`. This calls `GET /trails/{trail_id}/runs/{run_id}` using
        the selected account. The server enforces permissions.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd trail runs get TRAIL_ID RUN_ID
    - name: cancel-action
      operationId: apiTrailActionRunCancel
      description: Cancel an active Robot action.
      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: TRAIL_ID
        description: trail id
        required: true
      - name: RUN_ID
        description: run id
        required: true
      - name: ACTION_RUN_ID
        description: action run id
        required: true
      longDescription: |
        # Cancel an active Robot action

        Request cancellation for one queued or running Robot action. A queued
        action is cancelled before it starts. A running action forwards the
        cancellation request to the Robot session coordinator. Other action runs
        in the same Trail run continue independently.


        Inspect the local request and response contract with `sd api schema
        TrailActionRunCancel`. This calls `PUT
        /trails/{trail_id}/runs/{run_id}/actions/{action_run_id}/cancellation`
        using the selected account. The server enforces permissions. The request
        executes immediately; this is not a dry run. After an uncertain network
        failure, inspect current state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd trail runs cancel-action TRAIL_ID RUN_ID ACTION_RUN_ID
- name: asset
  description: Upload media files and download stored assets.
  longDescription: |
    # Asset

    Upload files to Storyden and download stored assets. Upload returns the
    asset metadata; use its ID with page asset commands or content references.
    Downloads use --output-file to save the original bytes.

    Commands send one request and return the full JSON response by default. Use
    explicit IDs from list/get output and `--context NAME` for automation.
    Mutations apply immediately; check current state before retrying after a
    network failure.

    ## Examples

    ~~~sh
    sd asset upload --help
    ~~~
  commands:
  - name: upload
    operationId: apiAssetUpload
    description: Upload and process a media file.
    flags:
    - name: filename
      description: The client-provided file name for the asset.
      trackChanged: true
    - name: parent-asset-id
      description: >-
        For uploading new versions of an existing asset, set this parameter to
      trackChanged: true
    - $ref: '#/components/flags/api-data'
    - $ref: '#/components/flags/api-file'
    - $ref: '#/components/flags/api-content-type'
    - $ref: '#/components/flags/api-output'
    - $ref: '#/components/flags/api-output-file'
    - $ref: '#/components/flags/api-timeout'
    longDescription: |
      # Upload and process a media file

      Upload and process a media file.

      ## Request body

      Send the file bytes with `--file PATH` and the appropriate
      `--content-type`. Accepted media types: `application/octet-stream`.

      Inspect the local request and response contract with `sd api schema
      AssetUpload`. This calls `POST /assets` using the selected account. The
      server enforces permissions. The request executes immediately; this is not
      a dry run. After an uncertain network failure, inspect current state
      before retrying a mutation.

      ## Output and automation

      The default `--output json` preserves the complete server response,
      including nested fields and pagination metadata. Empty responses print
      `null`; HEAD responses contain `status` and `headers`. Errors go to stderr
      and return a nonzero exit status. This command sends one request; it does
      not automatically traverse pages or cursors.
    examples:
    - command: sd asset upload --file upload.bin
  - name: download
    operationId: apiAssetGet
    description: Download an asset by its filename.
    flags:
    - $ref: '#/components/flags/api-output'
    - $ref: '#/components/flags/api-output-file'
    - $ref: '#/components/flags/api-timeout'
    arguments:
    - name: ASSET_FILENAME
      description: Asset ID.
      required: true
    longDescription: |
      # Download an asset by its filename

      Download an asset by its filename.

      Inspect the local request and response contract with `sd api schema
      AssetGet`. This calls `GET /assets/{asset_filename}` using the selected
      account. The server enforces permissions.

      ## Output and automation

      The default `--output json` preserves the complete server response,
      including nested fields and pagination metadata. Empty responses print
      `null`; HEAD responses contain `status` and `headers`. Errors go to stderr
      and return a nonzero exit status. This command sends one request; it does
      not automatically traverse pages or cursors. Save downloads with
      `--output-file PATH` or use `--output raw`; binary responses cannot be
      printed as JSON.
    examples:
    - command: sd asset download ASSET_FILENAME --output-file asset.bin
- name: api
  description: Discover API contracts and call operations by ID.
  longDescription: |
    # API discovery and advanced requests

    Use named resource commands for everyday work. This group provides the full
    compiled OpenAPI contract, including operations without a dedicated CLI
    command. `operations` and `schema` work offline and never load credentials.

    `schema OPERATION_ID` prints an OpenAPI excerpt containing that operation
    and all referenced components. Inspect requestBody, parameters, and
    responses before constructing a request. This describes the API version
    compiled into the CLI; a differently versioned server may expose a different
    contract.

    `request` sends one authenticated request to the selected Storyden instance.
    Use repeatable --path and --query KEY=VALUE to supply API parameter names
    exactly. JSON bodies use --data or --file; binary/form bodies require --file
    and an accepted --content-type. Requests execute immediately and do not
    retry failed mutations except the existing authentication refresh policy.
    Browser-dependent OAuth and WebAuthn ceremonies still need their
    browser/client interaction.

    JSON is the default. Use --output raw for streams/text or --output-file for
    binary data. Empty JSON responses print null; HEAD prints status and
    headers.

    ## Examples

    ~~~sh
    sd api operations
    sd api schema AdminSettingsUpdate
    sd api request CategoryList --output json
    ~~~
  commands:
  - name: operations
    operationId: listApi
    description: List compiled API operation IDs, methods, paths, and summaries.
    longDescription: |
      # Discover API operations

      Print a JSON array of operation IDs, methods, paths, and summaries from
      the compiled API contract. This is local and does not require
      authentication. Use an ID with `api schema` to inspect its contract, or
      `api request` to execute it. it.'
    examples:
    - command: sd api operations
  - name: schema
    operationId: describeApi
    description: Print the self-contained OpenAPI contract for one operation.
    longDescription: |
      # Inspect an API operation

      Print JSON containing the operation and all referenced OpenAPI components.
      This is local and requires no authentication. Read required fields, nested
      types, enum values, media types, and response schemas before sending a
      request. The contract matches this CLI build, not necessarily every server
      version. contract matches this CLI build, not necessarily every server
      version.'
    arguments:
    - name: OPERATION
      required: true
      description: Operation ID from sd api operations.
    examples:
    - command: sd api schema TrailCreate
  - name: request
    operationId: requestApi
    description: Execute an authenticated API operation by its operation ID.
    longDescription: |
      # Execute an API request

      Send one request using the compiled method/path and the selected auth
      context. Inspect `api schema OPERATION` first. Path and query names must
      exactly match that schema. JSON is validated locally before
      authentication. The server enforces authorization and business rules.

      Mutations apply immediately. Check state before retrying an uncertain
      request. No automatic pagination is performed. Body files use `--file -`
      for stdin. Use raw output for non-JSON responses and live streams. HEAD
      returns status and headers; empty JSON responses return null. headers;
      empty JSON responses return null.'
    arguments:
    - name: OPERATION
      required: true
      description: Operation ID from sd api operations.
    flags:
    - name: path
      repeatable: true
      description: Path parameter KEY=VALUE; repeat for each parameter.
    - name: query
      repeatable: true
      description: Query parameter KEY=VALUE; repeat for array elements.
    - name: data
      description: Inline JSON body; mutually exclusive with --file.
    - name: file
      description: Request body file; - reads stdin.
    - name: content-type
      description: >-
        Body media type; defaults to JSON where supported, otherwise
        application/octet-stream.
    - name: output-file
      description: Write successful response bytes to a file; overwrites it.
    - name: output
      short: o
      description: 'Response format: json (default) or raw.'
      default: json
      choices:
      - json
      - raw
    - name: timeout
      description: Request timeout, such as 60s; 0s disables the deadline.
      default: 60s
    examples:
    - command: sd api request CategoryList --output json
    - command: sd api request TrailGet --path trail_id=TRAIL_ID
- name: completion
  operationId: completion
  description: Generate Carapace shell completion setup.
  longDescription: |
    # Shell completion

    Print Carapace's setup snippet for your shell. Suggestions include command
    and flag names, declared choices, local files and contexts, and instance
    resource identifiers. Remote suggestions use the saved default context or
    `--context` from the command being completed. Lookups use normal credential
    refresh with a 1.5-second network timeout and silently return no values on
    failure. Lists are bounded to the first response and at most 100
    suggestions.

    For Bash or Zsh, source the output of `sd completion bash` or `sd completion
    zsh`. For Fish, run `sd completion fish | source`. For Nushell, save the
    output of `sd completion nushell` in your configuration and connect
    `$sd_completer` to your external completer dispatch for `sd`. The hidden
    `_carapace` callback also supports Carapace's multi-command integration. If
    using `carapace` as your external completer, save `sd completion carapace`
    as `sd.yaml` in the specs directory shown by `carapace --help`. This bridge
    delegates suggestions to `sd`, including through wrappers such as `sudo`.

    Free-form prompts, JSON bodies, passwords, and tokens are not suggested.
    Completions help discover identifiers; the server still checks permissions
    when you execute a command. Completing a mutation never executes that
    mutation.
  arguments:
  - name: SHELL
    description: Shell to generate setup for.
    choices: [bash, zsh, fish, nushell, powershell, elvish, oil, tcsh, xonsh, cmd-clink, carapace]
  examples:
  - command: sd completion nushell
  - command: source <(sd completion zsh)

components:
  flags:
    page:
      name: page
      description: First page to request (1-based); --all continues from this page.
      type: integer
      default: 1
    limit:
      name: limit
      description: Maximum matching items to return (0 = uncapped); use --all to traverse pages.
      type: integer
      default: 0
    all:
      name: all
      description: Continue through pages; JSONL streams items, JSON collects one object.
      type: boolean
    from-stdin:
      name: from-stdin
      description: >-
        Read slugs/IDs or page JSON objects one per line, before positional
        inputs.
      type: boolean
    dry-run:
      name: dry-run
      description: Emit planned inputs without mutations; does not validate remote existence or permissions.
      type: boolean
    force:
      name: force
      description: Overwrite existing destination files.
      type: boolean
    dir:
      name: dir
      description: Plugin project directory.
      type: path
      default: .
    manifest:
      name: manifest
      short: m
      description: Path to the plugin manifest file.
      type: file
      default: manifest.yaml
    list-format:
      name: output
      description: 'Output format; select json or jsonl explicitly for automation. Choices: auto, plain, json, jsonl.'
      choices: *id004
      default: auto
      short: o
    get-format:
      name: output
      short: o
      description: 'Output format; use json for automation. Choices: json, markdown, yaml.'
      choices:
      - json
      - markdown
      - yaml
      default: markdown
    properties-format:
      name: output
      short: o
      description: 'Output format; use json for automation. Choices: json, yaml.'
      choices:
      - json
      - yaml
      default: json
    batch-format:
      name: output
      description: 'Per-item results: plain on stderr, jsonl on stdout. Choices: plain, jsonl.'
      choices:
      - plain
      - jsonl
      default: plain
      short: o
    output-profile:
      name: columns
      description: 'Plain-table column profile; has no effect on JSON or JSONL. Choices: default, wide.'
      choices:
      - default
      - wide
      default: default
    api-output:
      name: output
      short: o
      description: >-
        Response format: json (default) or raw bytes. Empty JSON responses print
        null; HEAD prints status and headers.
      default: json
      choices:
      - json
      - raw
    api-output-file:
      name: output-file
      description: >-
        Write successful response bytes to this path instead of stdout;
        overwrites the file.
    api-timeout:
      name: timeout
      description: >-
        Request timeout including response reads, such as 60s. Use 0s for no
        deadline.
      default: 60s
    api-data:
      name: data
      description: >-
        Inline request JSON. Prefer --file for large documents or secrets.
    api-file:
      name: file
      description: >-
        Request body file; - reads stdin. Required when --data is omitted.
    api-content-type:
      name: content-type
      description: >-
        Request media type; defaults to application/json for JSON operations,
        otherwise application/octet-stream.
  arguments:
    node-slug:
      name: SLUG
      description: Page slug from page list/search/get output.
      placeholder: slug
    thread-mark:
      name: THREAD_MARK
      description: >-
        Thread ID or full ID-slug URL mark from thread list/search; not a bare
        readable slug.
      placeholder: thread-mark
    asset-id:
      name: ASSET_ID
      description: Uploaded asset ID from page get JSON (assets array).
      placeholder: asset-id
    plugin-instance-id:
      name: PLUGIN_INSTANCE_ID
      description: Installed instance ID from plugin list/get, not the manifest ID.
      placeholder: plugin-instance-id
    context-name:
      name: CONTEXT_NAME
      description: Name of the auth context. Prompts interactively to pick one if omitted.
      placeholder: context
      required: false
flags:
- name: context
  description: Saved identity for this invocation; avoids changing the shared default.
