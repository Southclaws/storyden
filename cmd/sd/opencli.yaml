  - name: sessions
    description: >-
      Submit messages, read conversation history, and follow Robot events.
    longDescription: |
      # Robot Sessions

      Submit messages, inspect shared Robot conversation history, and read
      persisted or live events. Submission acknowledges queued input; read
      events or history to observe results. Use turns to inspect or cancel a
      particular turn. Disconnecting a stream does not cancel execution.

      Commands send one request and return the full JSON response by default.
      Use explicit IDs from list/get output and `--context NAME` for automation.
      Mutations apply immediately; check current state before retrying after a
      network failure.

      ## Examples

      ~~~sh
      sd robot sessions submit --help
      ~~~
    commands:
    - name: submit
      operationId: apiRobotSessionCreate
      description: Submit a Robot session message.
      flags:
      - $ref: '#/components/flags/api-data'
      - $ref: '#/components/flags/api-file'
      - $ref: '#/components/flags/api-content-type'
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      longDescription: |
        # Submit a Robot session message

        Queue a message in a Robot session. The session is created when it does
        not already exist. New sessions use Denbot unless `robotId` selects a
        custom Robot, which then remains the root Robot for the session.

        Submission is asynchronous. The response identifies the accepted message
        and the session stream. Compatible queued messages may later be consumed
        together by one Robot turn.

        ## Request body

        Send JSON using `--file payload.json`, `--file -`, or `--data`.
        Top-level fields:

        - `id` (string, required).
        - `threadId` (string).
        - `sessionId` (string).
        - `robotId` (string).
        - `messages` (array, required).
        - `data` (object).
        - `context` (object).
        - `workspace` (object).
        - `client_tools` (object).

        Inspect the local request and response contract with `sd api schema
        RobotSessionCreate`. This calls `POST /robots/sessions` using the
        selected account. The server enforces permissions. The request executes
        immediately; this is not a dry run. After an uncertain network failure,
        inspect current state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors. For ordinary text
        prompts, prefer `sd robot chat MESSAGE`. This lower-level command
        accepts message parts, context, workspace, and client-tool payloads. Use
        a valid XID for the session identifier. Acceptance is asynchronous, not
        a completed Robot answer.
      examples:
      - command: sd robot sessions submit --file payload.json
    - name: list
      operationId: apiRobotSessionsList
      description: List robot sessions.
      flags:
      - name: page
        description: Pagination query parameters.
        trackChanged: true
      - name: account-id
        description: Account ID.
        trackChanged: true
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      longDescription: |
        # List robot sessions

        Get a paginated list of Robot sessions. These are chat sessions with the
        Robot system. Denbot may delegate work to specialised Robots inside the
        same session. Delegated events retain their ADK branch and isolation
        scope so the execution tree remains inspectable.

        You may include an account ID to filter sessions by account. Only those
        with "USE_ROBOTS" permission can use Robots, however sessions, messages
        and usage is not considered hidden to other accounts with the usage
        permission. Robots are intended as administrative or moderation tools to
        be shared among the team rather than private assistants.


        Inspect the local request and response contract with `sd api schema
        RobotSessionsList`. This calls `GET /robots/sessions` using the selected
        account. The server enforces permissions.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command fetches one page;
        pass `--page` explicitly to continue according to response pagination
        metadata.
      examples:
      - command: sd robot sessions list
    - name: get
      operationId: apiRobotSessionGet
      description: Get a robot session.
      flags:
      - name: before
        description: Load messages older than this message ID.
        trackChanged: true
      - name: limit
        description: Maximum number of messages to return.
        trackChanged: true
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: SESSION_ID
        description: Robot session ID
        required: true
      longDescription: |
        # Get a robot session

        Retrieve a specific robot session with a page of its messages. Sessions
        can involve interactions with multiple Robots, so Robot-authored
        messages identify the Robot. Messages may not be representative of
        exactly what is sent into a language model, as certain optimisations may
        be performed before this such as compaction, summarisation or removal of
        irrelevant context.

        Any member with `USE_ROBOTS` can see other members' sessions and
        messages with a Robot. Robots are not considered private assistants, but
        rather shared tools for the team to use for managing their community.

        The default page contains up to 50 messages. The `--limit` flag is
        clamped to 1–100; use `--before` with the returned message cursor to
        load older history.

        Reading a session records the requesting account's view and acknowledges
        session events through the returned stream offset.

        Inspect the local request and response contract with `sd api schema
        RobotSessionGet`. This calls `GET /robots/sessions/{session_id}` using
        the selected account. The server enforces permissions.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd robot sessions get SESSION_ID
    - name: events
      operationId: apiRobotSessionStream
      description: Read a Robot session event stream.
      flags:
      - name: offset
        description: >-
          Read events after this stream offset. Use `-1` to start at beginning.
        trackChanged: true
      - name: live
        description: >-
          Attach to the live stream tail after catching up. Choices: sse.
        trackChanged: true
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: SESSION_ID
        description: Robot session ID
        required: true
      longDescription: |
        # Read a Robot session event stream

        Read persisted events after an offset and optionally remain attached to
        the live session tail. The stream remains open while the session is idle
        so turns started by other members or background work are observable.


        Inspect the local request and response contract with `sd api schema
        RobotSessionStream`. This calls `GET
        /robots/sessions/{session_id}/stream` using the selected account. The
        server enforces permissions.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors. Without `--live`,
        the server returns the currently available JSON event batch. Use `--live
        sse --output raw --timeout 0s` to follow Server-Sent Events; interrupt
        to disconnect. Disconnecting does not cancel a Robot turn. Use the head
        command to inspect offsets without reading events.
      examples:
      - command: sd robot sessions events SESSION_ID
    - name: head
      operationId: apiRobotSessionStreamHead
      description: Inspect a Robot session event stream.
      flags:
      - name: offset
        description: >-
          Read events after this stream offset. Use `-1` to start at beginning.
        trackChanged: true
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: SESSION_ID
        description: Robot session ID
        required: true
      longDescription: |
        # Inspect a Robot session event stream

        Inspect the session event stream without reading any events. The
        supplied offset represents the last event already observed by the
        caller. The response reports the offset to use for the next read and
        whether that position is caught up with the stream's current tail. This
        request returns immediately and does not wait for future events.


        Inspect the local request and response contract with `sd api schema
        RobotSessionStreamHead`. This calls `HEAD
        /robots/sessions/{session_id}/stream` using the selected account. The
        server enforces permissions.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd robot sessions head SESSION_ID
    - name: turns
      description: Inspect individual Robot turns and request cancellation.
      longDescription: |
        # Robot Sessions Turns

        Read the event stream or metadata for one Robot turn, or request
        cancellation. Session and turn IDs come from accepted input responses or
        session events. Cancellation is a request; inspect subsequent events for
        the final state.

        Commands send one request and return the full JSON response by default.
        Use explicit IDs from list/get output and `--context NAME` for
        automation. Mutations apply immediately; check current state before
        retrying after a network failure.

        ## Examples

        ~~~sh
        sd robot sessions turns events --help
        ~~~
      commands:
      - name: events
        operationId: apiRobotSessionTurnGet
        description: Read a Robot session turn stream.
        flags:
        - name: offset
          description: >-
            Read events after this stream offset. Use `-1` to start at
            beginning.
          trackChanged: true
        - name: live
          description: >-
            Attach to the live stream tail after catching up. Choices: sse.
          trackChanged: true
        - $ref: '#/components/flags/api-output'
        - $ref: '#/components/flags/api-output-file'
        - $ref: '#/components/flags/api-timeout'
        arguments:
        - name: SESSION_ID
          description: Robot session ID
          required: true
        - name: TURN_ID
          description: Robot turn ID
          required: true
        longDescription: |
          # Read a Robot session turn stream

          Read persisted turn events after an offset, optionally attaching to
          the live tail using Server-Sent Events.


          Inspect the local request and response contract with `sd api schema
          RobotSessionTurnGet`. This calls `GET
          /robots/sessions/{session_id}/turns/{turn_id}` using the selected
          account. The server enforces permissions.

          ## Output and automation

          The default `--output json` preserves the complete server response,
          including nested fields and pagination metadata. Empty responses print
          `null`; HEAD responses contain `status` and `headers`. Errors go to
          stderr and return a nonzero exit status. This command sends one
          request; it does not automatically traverse pages or cursors. Without
          `--live`, the server returns the currently available JSON event batch.
          Use `--live sse --output raw --timeout 0s` to follow Server-Sent
          Events; interrupt to disconnect. Disconnecting does not cancel a Robot
          turn. Use the head command to inspect offsets without reading events.
        examples:
        - command: sd robot sessions turns events SESSION_ID TURN_ID
      - name: head
        operationId: apiRobotSessionTurnHead
        description: Inspect a Robot session turn stream.
        flags:
        - name: offset
          description: >-
            Read events after this stream offset. Use `-1` to start at
            beginning.
          trackChanged: true
        - $ref: '#/components/flags/api-output'
        - $ref: '#/components/flags/api-output-file'
        - $ref: '#/components/flags/api-timeout'
        arguments:
        - name: SESSION_ID
          description: Robot session ID
          required: true
        - name: TURN_ID
          description: Robot turn ID
          required: true
        longDescription: |
          # Inspect a Robot session turn stream

          Read the current stream offset and state without returning events.


          Inspect the local request and response contract with `sd api schema
          RobotSessionTurnHead`. This calls `HEAD
          /robots/sessions/{session_id}/turns/{turn_id}` using the selected
          account. The server enforces permissions.

          ## Output and automation

          The default `--output json` preserves the complete server response,
          including nested fields and pagination metadata. Empty responses print
          `null`; HEAD responses contain `status` and `headers`. Errors go to
          stderr and return a nonzero exit status. This command sends one
          request; it does not automatically traverse pages or cursors.
        examples:
        - command: sd robot sessions turns head SESSION_ID TURN_ID
      - name: cancel
        operationId: apiRobotSessionTurnCancel
        description: Request cancellation of a Robot session turn.
        flags:
        - $ref: '#/components/flags/api-output'
        - $ref: '#/components/flags/api-output-file'
        - $ref: '#/components/flags/api-timeout'
        arguments:
        - name: SESSION_ID
          description: Robot session ID
          required: true
        - name: TURN_ID
          description: Robot turn ID
          required: true
        longDescription: |
          # Request cancellation of a Robot session turn

          Create the singleton cancellation request for a queued, running, or
          blocked Robot turn. The operation is idempotent and asynchronous:
          accepted cancellation is reflected by a `turn_cancelled` event on the
          session stream. Cancelling a turn does not remove other queued
          messages, which remain eligible for later turns.


          Inspect the local request and response contract with `sd api schema
          RobotSessionTurnCancel`. This calls `PUT
          /robots/sessions/{session_id}/turns/{turn_id}/cancellation` using the
          selected account. The server enforces permissions. The request
          executes immediately; this is not a dry run. After an uncertain
          network failure, inspect current state before retrying a mutation.

          ## Output and automation

          The default `--output json` preserves the complete server response,
          including nested fields and pagination metadata. Empty responses print
          `null`; HEAD responses contain `status` and `headers`. Errors go to
          stderr and return a nonzero exit status. This command sends one
          request; it does not automatically traverse pages or cursors.
        examples:
        - command: sd robot sessions turns cancel SESSION_ID TURN_ID
  - name: mcp
    description: Connect MCP servers and discover the tools they provide.
    longDescription: |
      # Robot Mcp

      Manage MCP server connections whose tools can be made available to Robots.
      Probe a proposed connection, create it, inspect its configuration, and
      refresh tool discovery. Connecting a server does not replace the
      instance’s Robot permission checks.

      Commands send one request and return the full JSON response by default.
      Use explicit IDs from list/get output and `--context NAME` for automation.
      Mutations apply immediately; check current state before retrying after a
      network failure.

      ## Examples

