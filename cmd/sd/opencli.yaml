    - name: tokens
      description: Inspect and revoke OAuth refresh tokens across accounts.
      longDescription: |
        # Admin Oauth Tokens

        Inspect and revoke OAuth refresh tokens across the instance. Revoking a
        refresh token prevents it from obtaining new access tokens; already
        issued access tokens may remain usable until they expire.

        Commands send one request and return the full JSON response by default.
        Use explicit IDs from list/get output and `--context NAME` for
        automation. Mutations apply immediately; check current state before
        retrying after a network failure.

        ## Examples

        ~~~sh
        sd admin oauth tokens list --help
