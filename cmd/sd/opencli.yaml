  - name: versions
    description: Review page history and manage draft checkpoints.
    longDescription: |
      # Page Versions

      Manage Library page versions and publication state. List versions, inspect
      a version by ID, create or edit a version, and change its status. The
      draft subgroup accesses the page’s working draft. Use page drafts to find
      drafts across pages.

      Commands send one request and return the full JSON response by default.
      Use explicit IDs from list/get output and `--context NAME` for automation.
      Mutations apply immediately; check current state before retrying after a
      network failure.

      ## Examples

      ~~~sh
      sd page versions list --help
      ~~~
    commands:
    - name: list
      operationId: apiNodeVersionList
      description: List edit versions for a page.
      flags:
      - name: page
        description: Pagination query parameters.
        trackChanged: true
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: NODE_SLUG
        placeholder: page-slug
        description: Unique page Slug.
        required: true
      longDescription: |
        # List edit versions for a page

        List edit versions for a page.

        Versions have two states: draft and applied. A version is a draft when
        it is pre-published. There can only be a single draft of a page.

        Applied versions are immutable historical snapshots of the page fields
        that were copied into the page. The single draft version, when present,
        is the working snapshot ahead of the live page and is visible only to
        its author and members with `MANAGE_LIBRARY`.

        Results are ordered by `updated_at` descending so draft autosaves and
        recently applied checkpoints appear before older history.


        Inspect the local request and response contract with `sd api schema
        NodeVersionList`. This calls `GET /nodes/{node_slug}/versions` using the
        selected account. The server enforces permissions.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command fetches one page;
        pass `--page` explicitly to continue according to response pagination
        metadata. \ to response pagination metadata.\n"
      examples:
      - command: sd page versions list PAGE_SLUG
    - name: create
      operationId: apiNodeVersionCreate
      description: Create the single mutable draft checkpoint for a page.
      flags:
      - $ref: '#/components/flags/api-data'
      - $ref: '#/components/flags/api-file'
      - $ref: '#/components/flags/api-content-type'
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: NODE_SLUG
        placeholder: page-slug
        description: Unique page Slug.
        required: true
      longDescription: |
        # Create the single mutable draft checkpoint for a page

        Create the single mutable draft checkpoint for a page.

        This operation requires either `SUBMIT_LIBRARY_NODE_CHANGES` or
        `MANAGE_LIBRARY` permission. The draft starts as a full snapshot of the
        page's current versioned page fields. Fields supplied in the request
        overlay that snapshot, omitted fields keep the snapshotted value, and
        explicit null values clear nullable fields.

        A page can have only one draft. If a draft already exists for the page,
        this operation returns a conflict. Drafts do not mutate the target page
        until the draft is applied through the version status endpoint by a
        member with `MANAGE_LIBRARY`.

        ## Request body

        Send JSON using `--file payload.json`, `--file -`, or `--data`.
        Top-level fields:

        - `name` (string).
        - `slug` (string).
        - `description` (['string', 'null']).
        - `content` (['string', 'null']).
        - `properties` (array).
        - `meta` (object).

        Inspect the local request and response contract with `sd api schema
        NodeVersionCreate`. This calls `POST /nodes/{node_slug}/versions` using
        the selected account. The server enforces permissions. The request
        executes immediately; this is not a dry run. After an uncertain network
        failure, inspect current state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd page versions create PAGE_SLUG --file payload.json
    - name: get
      operationId: apiNodeVersionGet
      description: Get an edit version for a page.
      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: NODE_SLUG
        placeholder: page-slug
        description: Unique page Slug.
        required: true
      - name: VERSION_ID
        description: Page version ID.
        required: true
      longDescription: |
        # Get an edit version for a page

        Get an edit version for a page.

        The version must belong to the page identified by `node_slug`. Applied
        versions are immutable historical snapshots and are visible to callers
        who can read the target page. The draft version is visible only to its
        author and members with `MANAGE_LIBRARY`.


        Inspect the local request and response contract with `sd api schema
        NodeVersionGet`. This calls `GET
        /nodes/{node_slug}/versions/{version_id}` using the selected account.
        The server enforces permissions.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd page versions get PAGE_SLUG VERSION_ID
    - name: update
      operationId: apiNodeVersionUpdate
      description: Update the page's single draft checkpoint.
      flags:
      - $ref: '#/components/flags/api-data'
      - $ref: '#/components/flags/api-file'
      - $ref: '#/components/flags/api-content-type'
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: NODE_SLUG
        placeholder: page-slug
        description: Unique page Slug.
        required: true
      - name: VERSION_ID
        description: Page version ID.
        required: true
      longDescription: |
        # Update the page's single draft checkpoint

        Update the page's single draft checkpoint.

        This operation is for draft autosave and editing only. It does not
        change version status and cannot apply a version to the target page. The
        version must still have draft status and the caller must be the draft
        author or have `MANAGE_LIBRARY`.

        Fields omitted from the request are left unchanged on the draft
        snapshot. Explicit null values clear nullable fields. Properties are a
        complete desired-state list for the target page properties: when the
        version is applied, the list replaces the page's existing property set
        rather than merging with it.

        ## Request body

        Send JSON using `--file payload.json`, `--file -`, or `--data`.
        Top-level fields:

        - `name` (string).
        - `slug` (string).
        - `description` (['string', 'null']).
        - `content` (['string', 'null']).
        - `properties` (array).
        - `meta` (object).

        Inspect the local request and response contract with `sd api schema
        NodeVersionUpdate`. This calls `PATCH
        /nodes/{node_slug}/versions/{version_id}` using the selected account.
        The server enforces permissions. The request executes immediately; this
        is not a dry run. After an uncertain network failure, inspect current
        state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd page versions update PAGE_SLUG VERSION_ID --file payload.json
    - name: delete
      operationId: apiNodeVersionDelete
      description: Delete the working draft checkpoint.
      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: NODE_SLUG
        placeholder: page-slug
        description: Unique page Slug.
        required: true
      - name: VERSION_ID
        description: Page version ID.
        required: true
      longDescription: |
        # Delete the working draft checkpoint

        Delete the working draft checkpoint.

        A draft author can discard their own draft. Members with
        `MANAGE_LIBRARY` permission can discard any draft for the page. The
        draft row is removed from history. Applied versions are immutable
        history entries and cannot be deleted through this endpoint.


        Inspect the local request and response contract with `sd api schema
        NodeVersionDelete`. This calls `DELETE
        /nodes/{node_slug}/versions/{version_id}` using the selected account.
        The server enforces permissions. The request executes immediately; this
        is not a dry run. After an uncertain network failure, inspect current
        state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd page versions delete PAGE_SLUG VERSION_ID
    - name: status
      operationId: apiNodeVersionUpdateStatus
      description: Update the lifecycle status of a checkpoint.
      flags:
      - $ref: '#/components/flags/api-data'
      - $ref: '#/components/flags/api-file'
      - $ref: '#/components/flags/api-content-type'
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: NODE_SLUG
        placeholder: page-slug
        description: Unique page Slug.
        required: true
      - name: VERSION_ID
        description: Page version ID.
        required: true
      longDescription: |
        # Update the lifecycle status of a checkpoint

        Update the lifecycle status of a checkpoint.

        This endpoint is separate from the content patch endpoint because status
        changes have side effects. For the initial checkpoint workflow, the only
        supported transition is draft to applied. Applying a version is
        restricted to members with `MANAGE_LIBRARY`.

        Applying a draft copies the full draft snapshot into the target page,
        applies properties as a complete desired-state list, marks the version
        immutable, and updates the page's `current_version_id` pointer to the
        applied version. This is a linear operation; applying a draft does not
        merge against other draft or historical versions.

        Clients must use this endpoint for lifecycle transitions and must not
        combine status changes with regular draft content updates.

        ## Request body

        Send JSON using `--file payload.json`, `--file -`, or `--data`.
        Top-level fields:

        - `status` (string, required): `draft`, `applied`.

        Inspect the local request and response contract with `sd api schema
        NodeVersionUpdateStatus`. This calls `PATCH
        /nodes/{node_slug}/versions/{version_id}/status` using the selected
        account. The server enforces permissions. The request executes
        immediately; this is not a dry run. After an uncertain network failure,
        inspect current state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd page versions status PAGE_SLUG VERSION_ID --file payload.json
    - name: draft
      description: Read and edit a page’s working draft.
      longDescription: |
        # Page Versions Draft

        Read or update a Library page’s working draft. A page has at most one
        draft. Use page versions status to change a version’s publication state.

        Commands send one request and return the full JSON response by default.
        Use explicit IDs from list/get output and `--context NAME` for
        automation. Mutations apply immediately; check current state before
        retrying after a network failure.

        ## Examples

        ~~~sh
        sd page versions draft get --help
        ~~~
      commands:
      - name: get
        operationId: apiNodeVersionDraftGet
        description: Get the page's single working draft checkpoint.
        flags:
        - $ref: '#/components/flags/api-output'
        - $ref: '#/components/flags/api-output-file'
        - $ref: '#/components/flags/api-timeout'
        arguments:
        - name: NODE_SLUG
          placeholder: page-slug
          description: Unique page Slug.
          required: true
        longDescription: |
          # Get the page's single working draft checkpoint

          Get the page's single working draft checkpoint.

          This is a stable alias for the draft version of a page. It allows
          clients to read "the draft" without listing versions and inspecting
          status values. If the page has no draft, or the draft is not visible
          to the caller, this operation returns not found.

          The draft is visible only to its author and members with
          `MANAGE_LIBRARY`.


          Inspect the local request and response contract with `sd api schema
          NodeVersionDraftGet`. This calls `GET
          /nodes/{node_slug}/versions/draft` using the selected account. The
          server enforces permissions.

          ## Output and automation

          The default `--output json` preserves the complete server response,
          including nested fields and pagination metadata. Empty responses print
          `null`; HEAD responses contain `status` and `headers`. Errors go to
          stderr and return a nonzero exit status. This command sends one
          request; it does not automatically traverse pages or cursors.
        examples:
        - command: sd page versions draft get PAGE_SLUG
      - name: update
        operationId: apiNodeVersionDraftUpdate
        description: Update the page's single working draft checkpoint.
        flags:
        - $ref: '#/components/flags/api-data'
        - $ref: '#/components/flags/api-file'
        - $ref: '#/components/flags/api-content-type'
        - $ref: '#/components/flags/api-output'
        - $ref: '#/components/flags/api-output-file'
        - $ref: '#/components/flags/api-timeout'
        arguments:
        - name: NODE_SLUG
          placeholder: page-slug
          description: Unique page Slug.
          required: true
        longDescription: |
          # Update the page's single working draft checkpoint

          Update the page's single working draft checkpoint.

          This is a stable alias for patching the draft version of a page
          without first listing versions or knowing the draft version
          identifier. The page must already have a draft visible to the caller.
          This operation does not create a draft and does not apply the draft to
          the target page.

          The caller must be the draft author or have `MANAGE_LIBRARY`. Fields
          omitted from the request are left unchanged on the draft snapshot.
          Explicit null values clear nullable fields. Properties are a complete
          desired-state list for the target page properties.

          ## Request body

          Send JSON using `--file payload.json`, `--file -`, or `--data`.
          Top-level fields:

          - `name` (string).
          - `slug` (string).
          - `description` (['string', 'null']).
          - `content` (['string', 'null']).
          - `properties` (array).
          - `meta` (object).

          Inspect the local request and response contract with `sd api schema
          NodeVersionDraftUpdate`. This calls `PATCH
          /nodes/{node_slug}/versions/draft` using the selected account. The
          server enforces permissions. The request executes immediately; this is
          not a dry run. After an uncertain network failure, inspect current
          state before retrying a mutation.

          ## Output and automation

          The default `--output json` preserves the complete server response,
          including nested fields and pagination metadata. Empty responses print
          `null`; HEAD responses contain `status` and `headers`. Errors go to
          stderr and return a nonzero exit status. This command sends one
          request; it does not automatically traverse pages or cursors.
        examples:
        - command: sd page versions draft update PAGE_SLUG --file payload.json
  usage: page
  longDescription: |
    # Read and maintain Library pages

    A **page** is a page in Storyden's Library: the community's shared knowledge
    base. Use Library pages for lasting resources such as guides, directories,
    wikis, and catalogues. Use `thread` for conversations about those resources.

    The Library is a tree. Pages can have a parent and children, so a directory
    can contain individual entries and a guide can contain chapters. Each page
    has a unique editable URL slug, rich text content, and optional tags, typed
    properties, file attachments, an external link, and a cover image.
    Visibility controls its publication state, including drafts and pages
    submitted for review.

    ## Commands and workflows

    Pages are Library pages with HTML content, tags, attached links/assets, and
    an optional parent. Use `list`/`search` to discover slugs, `get` to read the
    full page, and `children` to browse direct descendants. `tree` is a
    human-readable overview.

    Use `create`/`update` for content, `move` for hierarchy, and `visibility` to
    publish. Create parents before children. `properties` manages typed fields
    shared by siblings; `meta` manages an unstructured JSON object. `assets`
    attaches files.

    For automation, select JSON explicitly. Batch delete/move/visibility support
    JSONL per-item outcomes and `--dry-run`; failures can leave successful items
    applied.

    ## Examples

    ~~~sh
    sd page list --all --output jsonl
    sd page get docs --output json
    ~~~
- name: plugin
  description: Build, develop, and manage Storyden plugins.
  commands:
  - name: get
    operationId: pluginGet
    aliases:
    - status
    description: Get plugin status and manifest information.
    arguments:
    - $ref: '#/components/arguments/plugin-instance-id'
    output:
      formats:
      - format: json
        default: true
        description: The plugin's status and manifest.
    usage: get <plugin-instance-id>
    longDescription: |
      # Inspect an installed plugin

      Fetch the installed plugin by its instance ID and return its status and manifest
      as JSON (no format flag needed). Discover IDs with `plugin list --output json`.
      Check the mode and state before using `activate`, `deactivate`, or `token rotate`;
      supervised and external plugins have different lifecycle controls.
    examples:
    - command: sd plugin get PLUGIN_INSTANCE_ID
  - name: list
    operationId: pluginList
    description: List plugins installed on the current instance.
    flags:
    - name: output
      description: 'Output format; use json for automation. Choices: auto, plain, json, jsonl.'
      choices: &id004
      - auto
      - plain
      - json
      - jsonl
      default: plain
      short: o
    - name: wide
      description: Show additional columns.
      type: boolean
    output:
      formatFlag: output
      formats:
      - format: auto
        description: Plain table in terminals and pipes; choose JSON explicitly for automation.
      - format: plain
        default: true
        description: Plain, one-record-per-line tabular text.
      - format: json
        description: Every installed plugin as a bare array (this command has no pagination).
      - format: jsonl
        description: One plugin per line as newline-delimited JSON.
    usage: list
    longDescription: |
      # Discover installed plugin instances

      List plugins installed on the selected instance. JSON is an array of plugin
      objects; JSONL emits one plugin per line. Read the returned `id` for subsequent
      commands, rather than substituting the manifest ID. `--wide` only adds plain-table
      columns. Use `plugin get ID` to inspect one instance in detail.
    examples:
    - command: sd plugin list --output json
    - command: sd plugin list --output jsonl
  - name: delete
    operationId: pluginDelete
    description: Delete a plugin from the current instance.
    arguments:
    - $ref: '#/components/arguments/plugin-instance-id'
    usage: delete <plugin-instance-id>
    longDescription: |
      # Remove an installed plugin

      Delete the specified plugin instance from the selected server without a
      confirmation prompt. Use `plugin list` and `plugin get` to verify the instance ID
      first. For a temporary stop of a supervised plugin, use `deactivate` instead.

      Prints a text confirmation on success. Query `plugin list --output json` afterward
      to verify removal; the local project files are not removed by this command.
    examples:
    - command: sd plugin delete PLUGIN_INSTANCE_ID
  - name: activate
    operationId: pluginActivate
    description: Start a supervised plugin.
    arguments:
    - $ref: '#/components/arguments/plugin-instance-id'
    output:
      formats:
      - format: json
        default: true
        description: The plugin's updated status.
    usage: activate <plugin-instance-id>
    longDescription: |
      # Start a supervised plugin

      Request active state for an installed supervised plugin and return the updated
      plugin object as JSON. No format flag is needed. Discover the instance ID with
      `plugin list`; external plugins are run by their own host or `plugin dev run`.

      The response records requested state, not proof of application readiness. Inspect
      `plugin get` and `plugin logs` for startup progress or failures.
    examples:
    - command: sd plugin activate PLUGIN_INSTANCE_ID
  - name: deactivate
    operationId: pluginDeactivate
    description: Stop a supervised plugin.
    arguments:
    - $ref: '#/components/arguments/plugin-instance-id'
    output:
      formats:
      - format: json
        default: true
        description: The plugin's updated status.
    usage: deactivate <plugin-instance-id>
    longDescription: |
      # Stop a supervised plugin

      Request inactive state for an installed supervised plugin and return its updated
      object as JSON. No format flag is needed. This keeps the installation for later
      activation; use `delete` to remove it. Inspect `plugin get` to check state.
    examples:
    - command: sd plugin deactivate PLUGIN_INSTANCE_ID
  - name: logs
    operationId: pluginLogs
    description: Stream supervised plugin logs.
    longDescription: |
      # Follow supervised plugin logs

      Stream a supervised plugin's server log events until the stream closes or the
      command is interrupted. Use this to investigate startup/runtime failures after
      `activate` or `dev install`. Output is the event data as text, not a JSON envelope.

      This is a long-running command with no built-in duration limit; automation should
      bound its process lifetime. Log contents are plugin-produced data and can contain
      sensitive application output. Use `plugin get` for a finite status request.
    arguments:
    - $ref: '#/components/arguments/plugin-instance-id'
    usage: logs <plugin-instance-id>
    examples:
    - command: sd plugin logs PLUGIN_INSTANCE_ID
  - name: token
    description: Manage external plugin RPC tokens.
    commands:
    - name: rotate
      operationId: pluginTokenRotate
      description: Regenerate and print an external plugin RPC token.
      longDescription: |
        # Rotate an external RPC token

        Regenerate the external plugin's connection token and print only the new secret
        and a newline to stdout. This changes the credential: configure the external
        process to use the new token before reconnecting. Keep stdout out of logs.

        The argument is the installed instance ID, not the manifest ID. Inspect the mode
        with `plugin get` first; supervised plugins do not use this external connection flow.
      arguments:
      - $ref: '#/components/arguments/plugin-instance-id'
      usage: rotate <plugin-instance-id>
      examples:
      - command: sd plugin token rotate PLUGIN_INSTANCE_ID
    longDescription: |
      # Manage external plugin credentials

      An external plugin uses an **RPC token** to authenticate its connection to
      the Storyden instance. This credential identifies the installed plugin; it
      is separate from the member credentials used by `sd auth` to administer
      that installation.

      ## Commands and workflows

      Use `rotate` to replace an external plugin's RPC connection token.
      Discover its instance ID and mode with `plugin list`/`get` first. Rotation
      changes credentials; use `dev run` to connect a local project through the
      CLI-managed workflow.

      ## Examples

      ~~~sh
      sd plugin get PLUGIN_INSTANCE_ID
      ~~~
    usage: token
  - name: dev
    description: Create, run, package, validate, and install plugin projects.
    commands:
    - name: new
      operationId: pluginDevNew
      description: Create a minimal plugin project.
      arguments:
      - name: DIRECTORY
        description: Directory to create the project in.
        type: path
      flags:
      - name: command
        description: Command used to run the plugin during dev (defaults to ./<directory-name>).
      - name: author
        description: Plugin author slug (defaults to an environment/git-derived value).
      - $ref: '#/components/flags/force'
      - name: template
        description: Template repository URL (reserved; not implemented yet).
      longDescription: |
        # Create a plugin manifest

        Create a local plugin directory with a minimal `manifest.yaml`. This writes a
        manifest, not application source. `--command` sets the executable in the manifest;
        use `--force` only when intending to overwrite an existing manifest.

        `--template` is reserved and currently errors. After adding your implementation,
        run `dev validate`, then `dev run` or `dev install`. Output is a text file-creation
        summary; no server authentication is required.
      usage: new <directory>
      examples:
      - command: sd plugin dev new ./my-plugin --command ./my-plugin --author my-name
    - name: run
      operationId: pluginDevRun
      description: Run a local plugin with STORYDEN_RPC_URL set from the current instance.
      longDescription: |
        # Run a local external plugin

        Read the manifest, register or update an external plugin on the selected server,
        then execute its command locally with `STORYDEN_RPC_URL` in the environment.
        `--instance-id` chooses an existing installation; `--no-update` prevents manifest
        updates to an existing instance. Pass `-- COMMAND ARGS...` to override the command.

        This starts a child process and can run indefinitely. Its stdout/stderr are the
        plugin's output; CLI setup diagnostics go to stderr. Use in an interactive or
        supervised development session. For server-managed execution use `dev install`
        and `plugin activate`. Treat the RPC URL as a credential.
      arguments:
      - name: COMMAND
        description: Command and arguments to run instead of the manifest's own command, conventionally after --.
        required: false
        variadic: true
      flags:
      - $ref: '#/components/flags/manifest'
      - name: instance-id
        description: Existing plugin installation ID to update instead of matching by manifest id.
      - name: no-update
        description: Skip updating the existing external plugin manifest before running.
        type: boolean
      usage: run [-- command args...]
      examples:
      - command: sd plugin dev run --manifest ./my-plugin/manifest.yaml
      - command: sd plugin dev run --manifest manifest.yaml -- go run .
    - name: package
      operationId: pluginDevPackage
      description: Create a supervised plugin package zip.
      flags:
      - $ref: '#/components/flags/dir'
      - $ref: '#/components/flags/manifest'
      - name: output-file
        description: 'Destination ZIP path (default: derived from the plugin manifest).'
      - $ref: '#/components/flags/force'
      longDescription: |
        # Build a supervised distribution ZIP

        Validate and collect the local plugin project into a ZIP, generating
        `manifest.json` from the YAML manifest. It includes the project files selected
        by the packaging rules; inspect the project before distributing it.

        `--output-file PATH` sets the destination; the default derives from the manifest.
        Existing output requires `--force`. This writes a local file and prints a summary;
        it does not install on a server. Use `dev install` to upload the project.
      usage: package
      examples:
      - command: sd plugin dev package --dir ./my-plugin --output-file ./my-plugin.zip
    - name: validate
      operationId: pluginDevValidate
      description: Validate a plugin manifest and supervised package.
      flags:
      - $ref: '#/components/flags/dir'
      - $ref: '#/components/flags/manifest'
      longDescription: |
        # Validate a local supervised package

        Read the local manifest and build the package in memory to check packaging
        requirements. No server request or installation occurs, and no distribution ZIP
        is written. Success prints the manifest ID and file count; errors exit nonzero.

        Validation does not execute the plugin or prove runtime compatibility. Fix reported
        manifest/file errors, then use `dev package` or `dev install`.
      usage: validate
      examples:
      - command: sd plugin dev validate --dir ./my-plugin
    - name: install
      operationId: pluginDevInstall
      description: Install or update a local plugin as supervised.
      flags:
      - $ref: '#/components/flags/dir'
      - $ref: '#/components/flags/manifest'
      longDescription: |
        # Install or update a supervised plugin

        Build the local project package and upload it to the selected instance.
        An existing supervised installation matching the manifest ID is updated;
        otherwise one is created. A matching external installation causes an
        error: this command does not convert an installation from external to
        supervised mode. This changes server-side plugin code/configuration, so
        inspect the target context and run `dev validate` first.

        Prints a text summary including the instance ID. Use `plugin list
        --output json` to discover installations, then `plugin get` and `logs`
        to check runtime state. For running the code locally as an external
        process, use `dev run`.
      usage: install
      examples:
      - command: sd plugin dev validate --dir ./my-plugin
      - command: sd --context my-bot plugin dev install --dir ./my-plugin
    - name: download
      operationId: pluginDevDownload
      description: Download an installed plugin package.
      arguments:
      - $ref: '#/components/arguments/plugin-instance-id'
      flags:
      - $ref: '#/components/flags/dir'
      - name: no-unzip
        description: Save the zip without extracting it.
        type: boolean
      - $ref: '#/components/flags/force'
      longDescription: |
        # Retrieve an installed package

        Download the supervised package for an installed plugin instance. By default
        extract it into `--dir`; `--no-unzip` saves the ZIP there instead. Existing files
        are refused unless `--force` is supplied. This writes local files and prints a
        summary, with progress on stderr.

        Use `plugin list --output json` to discover the instance ID. Downloading does not
        run or install the package; inspect it before executing project code.
      usage: download <plugin-instance-id>
      examples:
      - command: sd plugin dev download PLUGIN_INSTANCE_ID --dir ./downloaded-plugin
      - command: sd plugin dev download PLUGIN_INSTANCE_ID --dir ./packages --no-unzip
    - name: symbols
      description: Discover Go packages and symbols in a plugin project.
      commands:
      - name: packages
        operationId: pluginDevSymbolsPackages
        description: List Go packages in a plugin project.
        flags:
        - $ref: '#/components/flags/dir'
        - name: pattern
          description: Go package pattern to scan.
          default: ./...
        - name: include-deps
          description: Include third-party dependency packages.
          type: boolean
        - name: max
          description: Maximum results to return.
          type: integer
          default: 100
        output:
          formats:
          - format: json
            default: true
            description: Discovered packages.
        usage: packages
        longDescription: |
          # Discover Go import paths

          Load matching Go packages from the local project and return JSON package
          summaries. `--pattern` defaults to `./...`; use `--include-deps` to include imported
          packages. `--max` bounds returned packages. No Storyden authentication is needed.

          Use returned import paths with `symbols package`, then request `detail` for a
          specific symbol instead of reading every source file. JSON includes `packages` and `truncated`; inspect per-package
          `error` fields because a successful command can include packages that failed to load.
        examples:
        - command: sd plugin dev symbols packages --dir ./my-plugin --max 20
      - name: package
        operationId: pluginDevSymbolsPackage
        description: List exported symbols in a Go package.
        arguments:
        - name: IMPORT_PATH
          description: The Go package's import path.
        flags:
        - $ref: '#/components/flags/dir'
        - name: include-unexported
          description: Include unexported symbols.
          type: boolean
        - name: max
          description: Maximum results to return.
          type: integer
          default: 100
        output:
          formats:
          - format: json
            default: true
            description: Discovered symbols.
        usage: package <import-path>
        longDescription: |
          # List a Go package’s symbols

          Inspect a Go import path in the local project and return symbol summaries as
          JSON. Exported symbols are shown by default; add `--include-unexported` for local
          implementation work. `--max` bounds the result.

          Discover import paths with `symbols packages`; follow with `symbols detail
          IMPORT_PATH SYMBOL` for an individual declaration. JSON includes `package`, `imports`, `symbols`, and `truncated`.
        examples:
        - command: sd plugin dev symbols package github.com/Southclaws/storyden/sdk/go/storyden --dir ./my-plugin
            --max 20
      - name: detail
        operationId: pluginDevSymbolsDetail
        description: Show detail for a single Go symbol.
        arguments:
        - name: IMPORT_PATH
          description: The Go package's import path.
        - name: SYMBOL
          description: The symbol name.
        flags:
        - $ref: '#/components/flags/dir'
        output:
          formats:
          - format: json
            default: true
            description: Symbol detail.
        usage: detail <import-path> <symbol>
        longDescription: |
          # Inspect one Go symbol

          Return JSON detail for SYMBOL in IMPORT_PATH, loaded from the selected local Go
          project. Obtain the import path and symbol name from `symbols package` or `search`.
          This provides focused API context for implementing a plugin without running it.
        examples:
        - command: sd plugin dev symbols detail github.com/Southclaws/storyden/sdk/go/storyden Plugin --dir ./my-plugin
      - name: search
        operationId: pluginDevSymbolsSearch
        description: Search Go symbols in a plugin project.
        longDescription: |
          # Find Go symbols by query

          Search local Go symbol names and documentation using a case-insensitive literal
          substring; regex and wildcard queries are rejected. JSON contains `results` and
          `truncated`. Use
          `--pattern` to restrict packages, `--include-deps` to search imported packages,
          and `--include-unexported` for private implementation details. `--max` bounds matches.

          Use this before implementing a capability to find the available SDK API. Follow
          matches with `symbols detail IMPORT_PATH SYMBOL` for exact declarations.
        arguments:
        - name: QUERY
          description: The symbol search query.
        flags:
        - $ref: '#/components/flags/dir'
        - name: pattern
          description: Go package pattern to scan.
          default: ./...
        - name: include-deps
          description: Include third-party dependency packages.
          type: boolean
        - name: include-unexported
          description: Include unexported symbols.
          type: boolean
        - name: max
          description: Maximum results to return.
          type: integer
          default: 100
        output:
          formats:
          - format: json
            default: true
            description: Matching symbols.
        usage: search <query>
        examples:
        - command: sd plugin dev symbols search Client --dir ./my-plugin --include-deps --max 10
      longDescription: |
        # Discover Go APIs for plugin development

        Go plugins use packages and exported symbols (types, functions, and
        methods) to interact with the Storyden SDK. These commands let you
        discover those APIs from the local project's Go modules before writing
        integration code.

        ## Commands and workflows

        Inspect a local Go project without executing the plugin. Use `packages`
        to find import paths, `package` to list a package's symbols, `search`
        for a name/topic, and `detail` for a known symbol. All leaf commands
        return JSON; no format flag is needed.

        The project must be loadable by the Go toolchain; module resolution may
        access the network. Narrow `--pattern` and `--max` for bounded agent
        context before requesting individual details.

        ## Examples

        ~~~sh
        sd plugin dev symbols packages --dir ./my-plugin --max 20
        sd plugin dev symbols search Client --dir ./my-plugin --max 10
        ~~~
      usage: symbols
    longDescription: |
      # Develop and install a plugin

      Plugin development starts with a local program and a **manifest**
      describing its identity, event subscriptions, permissions, and
      configuration. A supervised plugin also declares the command that Storyden
      runs. The CLI connects this local project to an installed plugin on a
      selected Storyden instance.

      ## Commands and workflows

      Start a local project with `new`, inspect available Go APIs with
      `symbols`, and check the manifest/package with `validate`. `package`
      writes a distribution ZIP. `install` uploads or updates a supervised
      plugin on the selected instance.

      For a local external process use `run`, which registers/updates the plugin
      and provides its RPC connection URL to the child process. `download`
      retrieves an installed supervised package. Local project commands use
      `--dir` where offered; server operations use the selected auth context.

      ## Examples

      ~~~sh
      sd plugin dev validate --dir ./my-plugin
      sd plugin dev install --dir ./my-plugin
      ~~~
    usage: dev
  - name: configuration
    description: Inspect a plugin’s settings schema and configure its values.
    longDescription: |
      # Plugin Configuration

      Read a plugin’s configuration schema and current configuration, then
      submit updated values. Consult schema before constructing a settings
      document; plugin-specific fields vary.

      Commands send one request and return the full JSON response by default.
      Use explicit IDs from list/get output and `--context NAME` for automation.
      Mutations apply immediately; check current state before retrying after a
      network failure.

      ## Examples

      ~~~sh
      sd plugin configuration get --help
      ~~~
    commands:
    - name: get
      operationId: apiPluginGetConfiguration
      description: Get the current configuration values for a plugin.
      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: PLUGIN_INSTANCE_ID
        description: Plugin ID.
        required: true
      longDescription: |
        # Get the current configuration values for a plugin

        Get the current configuration values for a plugin. The shape of the
        object is defined by the plugin's manifest and should be used to render
        the current configuration state in the client, using the layout driven
        by the result of `PluginGetConfigurationSchema` to build a form-like UI.


        Inspect the local request and response contract with `sd api schema
        PluginGetConfiguration`. This calls `GET
        /plugins/{plugin_instance_id}/configuration` using the selected account.
        The server enforces permissions.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd plugin configuration get PLUGIN_INSTANCE_ID
    - name: set
      operationId: apiPluginUpdateConfiguration
      description: Update the configuration for a plugin.
      flags:
      - $ref: '#/components/flags/api-data'
      - $ref: '#/components/flags/api-file'
      - $ref: '#/components/flags/api-content-type'
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: PLUGIN_INSTANCE_ID
        description: Plugin ID.
        required: true
      longDescription: |
        # Update the configuration for a plugin

        Update the configuration for a plugin. Each plugin defines its own set
        of configuration parameters in its manifest and this endpoint accepts
        any object validated against that schema. When a valid configuration is
        received, it is sent to the plugin via RPC and the plugin is expected to
        apply the new configuration to itself internally.

        ## Request body

        Send JSON using `--file payload.json`, `--file -`, or `--data`. The body
        may be an array or composed type; inspect the schema before constructing
        it.

        Inspect the local request and response contract with `sd api schema
        PluginUpdateConfiguration`. This calls `PATCH
        /plugins/{plugin_instance_id}/configuration` using the selected account.
        The server enforces permissions. The request executes immediately; this
        is not a dry run. After an uncertain network failure, inspect current
        state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd plugin configuration set PLUGIN_INSTANCE_ID --file payload.json
    - name: schema
      operationId: apiPluginGetConfigurationSchema
      description: >-
        Returns the configuration schema for a plugin as defined in its manifest
        file.
      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: PLUGIN_INSTANCE_ID
        description: Plugin ID.
        required: true
      longDescription: |
        # Read the plugin configuration schema

        Returns the configuration schema for a plugin as defined in its manifest
        file. The schema should be used to render a configuration form for the
        plugin in the client so that administrators can configure the plugin.


        Inspect the local request and response contract with `sd api schema
        PluginGetConfigurationSchema`. This calls `GET
        /plugins/{plugin_instance_id}/configuration-schema` using the selected
        account. The server enforces permissions.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd plugin configuration schema PLUGIN_INSTANCE_ID
  - name: manifest
    description: Update an external plugin’s declared capabilities.
    longDescription: |
      # Plugin Manifest

      Update the manifest of an external plugin installation. Inspect the
      installed plugin and operation requirements before changing its declared
      capabilities.

      Commands send one request and return the full JSON response by default.
      Use explicit IDs from list/get output and `--context NAME` for automation.
      Mutations apply immediately; check current state before retrying after a
      network failure.

      ## Examples

      ~~~sh
      sd plugin manifest update --help
      ~~~
    commands:
    - name: update
      operationId: apiPluginUpdateManifest
      description: Update the manifest for a plugin.
      flags:
      - $ref: '#/components/flags/api-data'
      - $ref: '#/components/flags/api-file'
      - $ref: '#/components/flags/api-content-type'
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: PLUGIN_INSTANCE_ID
        description: Plugin ID.
        required: true
      longDescription: |
        # Update the manifest for a plugin

        Update the manifest for a plugin. This is used for development of
        plugins where the manifest may change frequently and it's useful to be
        able to update it without re-uploading the entire plugin bundle.

        This only works for External plugins that were created by uploading a
        manifest directly. It does not work for Supervised plugins.

        ## Request body

        Send JSON using `--file payload.json`, `--file -`, or `--data`. The body
        may be an array or composed type; inspect the schema before constructing
        it.

        Inspect the local request and response contract with `sd api schema
        PluginUpdateManifest`. This calls `PATCH
        /plugins/{plugin_instance_id}/manifest` using the selected account. The
        server enforces permissions. The request executes immediately; this is
        not a dry run. After an uncertain network failure, inspect current state
        before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors. \ or cursors.\n"
      examples:
      - command: sd plugin manifest update PLUGIN_INSTANCE_ID --file payload.json
  longDescription: |
    # Operate and develop plugins

    A **plugin** is a regular program that extends a Storyden community without
    changing the server's core code. Plugins communicate through authenticated
    RPC and can subscribe to events, integrate other services, and use permitted
    API operations. A manifest describes the plugin's identity, capabilities,
    and settings.

    **Supervised** plugins are packaged and run by Storyden; the instance
    manages starting, stopping, and collecting their logs. **External** plugins
    run in a process you host and connect to Storyden using an RPC token. Choose
    external mode for local development or separately hosted integrations.

    ## Commands and workflows

    Use `list` to discover installed plugin instance IDs, `get` to inspect a
    manifest and state, and `activate`/`deactivate` for supervised processes.
    `logs` streams runtime output. `delete` removes an installed plugin; `token
    rotate` changes an external plugin's connection credential.

    Use `dev` for local project work: inspect Go APIs with `symbols`,
    build/validate a package, install it on the selected instance, or run an
    external plugin locally. Instance IDs come from server responses and differ
    from manifest identifiers.

    ## Examples

    ~~~sh
    sd plugin list --output json
    sd plugin get PLUGIN_INSTANCE_ID
    ~~~
  usage: plugin
- name: thread
  description: Read, start, and participate in discussions.
  commands:
  - name: get
    operationId: threadGet
    description: Get a thread by its mark.
    arguments:
    - $ref: '#/components/arguments/thread-mark'
    flags:
    - $ref: '#/components/flags/get-format'
    examples:
    - command: sd thread get THREAD_MARK --output json
    output:
      formatFlag: output
      formats:
      - format: markdown
        default: true
        description: Rich terminal rendering of the thread body and metadata.
      - format: json
        description: >-
          Thread object with the first page of replies (up to 50), including
          reply pagination metadata.
      - format: yaml
        description: Readable YAML projection of the resource.
    longDescription: |
      # Read a discussion

      Fetch a thread by its ID or full `ID-slug` mark from a list/search result.
      A bare readable slug is not accepted. Read the thread before drafting a
      reply; JSON contains the API thread object and HTML post bodies. Use its
      thread ID for `thread reply` and a post ID for `--reply-to` when needed.

      Default output is a readable Markdown view. Use `--output json` for full
      fields; YAML is a readable projection. Only the first reply page (up to 50
      replies) is fetched; inspect `.replies.next_page` in JSON. This command
      has no reply-page flag. For later pages, use the HTTP API `GET
      /api/threads/{mark}?page=N` with credentials from `auth headers`. This
      command does not post or edit content.
    usage: get <thread-mark>
  - name: list
    operationId: threadList
    description: List recent Storyden threads.
    flags:
    - $ref: '#/components/flags/all'
    - $ref: '#/components/flags/page'
    - $ref: '#/components/flags/limit'
    - $ref: '#/components/flags/list-format'
    - $ref: '#/components/flags/output-profile'
    examples:
    - command: sd thread list --output json
    - command: sd thread list --all --limit 20 --output jsonl
    output:
      formatFlag: output
      formats:
      - format: auto
        default: true
        description: Plain table in terminals and pipes; choose JSON explicitly for automation.
      - format: plain
        description: Plain, one-record-per-line tabular text.
      - format: json
        description: Object with threads and page metadata; --all returns only threads.
      - format: jsonl
        description: One thread per line as newline-delimited JSON.
    longDescription: |
      # Browse discussions

      List threads visible to the selected identity. Use `search --kind thread` to
      find discussions by topic. Read a selected thread using `thread get` before replying.

      ## Output and pagination

      Select `--output json` for a single JSON object or `--output jsonl` for one item per
      line. Defaults are plain tables, including when piped. One page is fetched unless
      `--all` is set; `--limit N` caps returned matches, not the server's page size.
      JSONL can emit partial results before a later page fails; check the exit status.

      JSON contains `threads` and page metadata; with `--all`, only `threads`. Entries
      are references rather than complete conversations. `--columns wide` adds human
      readable columns without changing JSON output.
    usage: list
  - name: create
    operationId: threadCreate
    description: Create a thread as the selected account.
    flags:
    - name: title
      description: Thread title.
      required: true
    - &id001
      name: content
      description: Content as HTML (or Markdown with --markdown).
    - &id002
      name: content-file
      description: Content file (- reads stdin); HTML unless --markdown is set.
      type: file
    - &id003
      name: markdown
      description: Convert content input from Markdown to HTML before sending.
      type: boolean
    - name: visibility
      description: 'Thread visibility. Choices: draft, review, published, unlisted.'
      choices:
      - draft
      - review
      - published
      - unlisted
      default: published
    - name: category
      description: Category ID.
    - name: output
      description: 'Output format; use json for automation. Choices: plain, json.'
      choices:
      - plain
      - json
      default: plain
      short: o
    usage: create
    longDescription: |
      # Start a discussion

      Create a thread as the selected identity. `--title` is required. Visibility
      defaults to `published`, so use `--visibility draft` when preparing content that
      should not yet be published. `--category` takes a category ID, not its slug.

      Content is HTML by default. Pass `--markdown` to convert Markdown before sending.
      Use either `--content TEXT` or `--content-file PATH`; `--content-file -` reads stdin.

      `--output json` returns the created thread, including its `id`. Save the returned
      identifiers for follow-up operations. After an uncertain network failure, inspect
      existing discussions before retrying to avoid duplicate topics.
    examples:
    - command: sd thread create --title "Release notes" --visibility draft --markdown --content-file release.md
        --output json
  - name: reply
    operationId: threadReply
    description: Reply to a thread as the selected account.
    arguments:
    - name: THREAD_ID
      description: >-
        Thread ID or full ID-slug mark; a bare readable slug is not accepted.
    flags:
    - *id001
    - *id002
    - *id003
    - name: reply-to
      description: Post ID to reply to within the thread.
    - name: output
      description: 'Output format; use json for automation. Choices: plain, json.'
      choices:
      - plain
      - json
      default: plain
      short: o
    usage: reply THREAD_ID
    longDescription: |
      # Post to an existing discussion

      Post a reply as the selected identity using a thread ID or full `ID-slug`
      mark. A bare readable slug is not accepted. Read the thread first.
      `--reply-to POST_ID` targets a particular post within it; omit that flag
      for a general reply. A non-empty content body is required.

      Content is HTML by default. Pass `--markdown` to convert Markdown before
      sending. Use either `--content TEXT` or `--content-file PATH`;
      `--content-file -` reads stdin.

      `--output json` returns the created reply. Posting takes effect
      immediately; after an uncertain failure, read the thread before retrying
      to avoid duplicates.
    examples:
    - command: sd thread reply THREAD_ID --markdown --content-file reply.md --output json
    - command: sd thread reply THREAD_ID --reply-to POST_ID --content "<p>Thanks for the details.</p>" --output
        json
  - name: update
    operationId: apiThreadUpdate
    description: Publish changes to a thread.
    flags:
    - $ref: '#/components/flags/api-data'
    - $ref: '#/components/flags/api-file'
    - $ref: '#/components/flags/api-content-type'
    - $ref: '#/components/flags/api-output'
    - $ref: '#/components/flags/api-output-file'
    - $ref: '#/components/flags/api-timeout'
    arguments:
    - name: THREAD_MARK
      description: Thread unique and permanent identifier.
      required: true
    longDescription: |
      # Publish changes to a thread

      Publish changes to a thread.

      ## Request body

      Send JSON using `--file payload.json`, `--file -`, or `--data`. Top-level
      fields:

      - `title` (string).
      - `pinned` (integer).
      - `body` (string).
      - `tags` (array).
      - `meta` (object).
      - `category` (string).
      - `visibility` (string): `draft`, `unlisted`, `review`, `published`.
      - `url` (string).

      Inspect the local request and response contract with `sd api schema
      ThreadUpdate`. This calls `PATCH /threads/{thread_mark}` using the
      selected account. The server enforces permissions. The request executes
      immediately; this is not a dry run. After an uncertain network failure,
      inspect current state before retrying a mutation.

      ## Output and automation

      The default `--output json` preserves the complete server response,
      including nested fields and pagination metadata. Empty responses print
      `null`; HEAD responses contain `status` and `headers`. Errors go to stderr
      and return a nonzero exit status. This command sends one request; it does
      not automatically traverse pages or cursors.
    examples:
    - command: sd thread update THREAD_ID --file payload.json
  - name: delete
    operationId: apiThreadDelete
    description: Archive a thread using soft-delete.
    flags:
    - $ref: '#/components/flags/api-output'
    - $ref: '#/components/flags/api-output-file'
    - $ref: '#/components/flags/api-timeout'
    arguments:
    - name: THREAD_MARK
      description: Thread unique and permanent identifier.
      required: true
    longDescription: |
      # Archive a thread using soft-delete

      Archive a thread using soft-delete.


      Inspect the local request and response contract with `sd api schema
      ThreadDelete`. This calls `DELETE /threads/{thread_mark}` using the
      selected account. The server enforces permissions. The request executes
      immediately; this is not a dry run. After an uncertain network failure,
      inspect current state before retrying a mutation.

      ## Output and automation

      The default `--output json` preserves the complete server response,
      including nested fields and pagination metadata. Empty responses print
      `null`; HEAD responses contain `status` and `headers`. Errors go to stderr
      and return a nonzero exit status. This command sends one request; it does
      not automatically traverse pages or cursors.
    examples:
    - command: sd thread delete THREAD_ID
  - name: page
    operationId: apiThreadGet
    description: Get information about a thread and the posts within the thread.
    flags:
    - name: page
      description: Pagination query parameters.
      trackChanged: true
    - $ref: '#/components/flags/api-output'
    - $ref: '#/components/flags/api-output-file'
    - $ref: '#/components/flags/api-timeout'
    arguments:
    - name: THREAD_MARK
      description: Thread unique and permanent identifier.
      required: true
    longDescription: |
      # Get information about a thread and the posts within the thread

      Get information about a thread such as its title, author, when it was
      created as well as a list of the posts within the thread.


      Inspect the local request and response contract with `sd api schema
      ThreadGet`. This calls `GET /threads/{thread_mark}` using the selected
      account. The server enforces permissions.

      ## Output and automation

      The default `--output json` preserves the complete server response,
      including nested fields and pagination metadata. Empty responses print
      `null`; HEAD responses contain `status` and `headers`. Errors go to stderr
      and return a nonzero exit status. This command fetches one page; pass
      `--page` explicitly to continue according to response pagination metadata.
    examples:
    - command: sd thread page THREAD_ID
  usage: thread
  longDescription: |
    # Read and participate in discussions

    A **thread** starts a discussion: a titled opening post followed by replies
    from community members. Categories organise threads, while tags connect
    related topics. Replies can address the thread or a particular post within
    it; they have bodies but no separate title, category, or tags.

    Use threads to ask questions, share announcements, and join ongoing
    conversations. Use `page` for curated Library pages that should remain
    useful as shared knowledge. A thread's **mark** is its URL identifier (an ID
    with a readable slug); reads also accept the ID alone. Library pages use
    their own editable slugs instead.

    ## Commands and workflows

    Use `list` or `search --kind thread` to discover discussions, then `get` to
    read one before posting. `create` starts a new thread; `reply` posts as the
    selected identity in an existing one. Mutations post immediately, so match
    the user's requested audience and content.

    Use JSON to obtain identifiers. `get` accepts a thread mark or ID, while
    `reply` also accepts either form. A bare readable slug is not accepted.
    Content input is HTML unless `--markdown` is set.

    ## Examples

    ~~~sh
    sd thread list --output json
    sd thread get THREAD_MARK --output json
    ~~~
- name: tui
  operationId: tui
  description: Explore Storyden content in an interactive TUI.
  longDescription: |
    # Browse interactively

    Open a full-screen explorer for a person using a terminal. For agents and
    scripts, use `page list`, `thread list`, or `search` with explicit
    JSON/JSONL output instead.

    ## Navigation

    - `n` / `t`: switch between pages and threads.
    - Arrow keys or `j` / `k`: move selection; `h` / `l`: change pages.
    - Enter: open the selected resource. `c`: browse a page's children.
    - Backspace: return to the previous view/level. `r`: refresh.
    - `q` or Ctrl+C: quit. Escape quits from the list and returns to the list
      from a document.
  usage: tui
  examples:
  - command: sd tui
- name: admin
  description: >-
    Configure the community and administer accounts, access, and moderation.
  longDescription: |
    # Admin

    Manage instance settings, appearance, accounts, moderation, and OAuth
    access. These commands use the selected identity; the server enforces its
    permissions. Read settings before changing them. `settings update` changes
    stored settings, not deployment environment variables. Settings responses
    may contain secrets.

    Use `admin settings get` to inspect configuration, `admin accounts list` to
    find accounts, and `admin audit list` to investigate changes.

    Commands send one request and return the full JSON response by default. Use
    explicit IDs from list/get output and `--context NAME` for automation.
    Mutations apply immediately; check current state before retrying after a
    network failure.

    ## Examples

    ~~~sh
    sd admin settings --help
    ~~~
  commands:
