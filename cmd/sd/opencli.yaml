    - $ref: '#/components/flags/api-timeout'
    longDescription: |
      # Create a robot

      Create a new Robot with the specified configuration. A Robot in Storyden
      consists of a name and description (for humans) as well as a playbook, and
      a set of direct tools and reusable Toolsets to interact with Storyden
      plugins, or connected MCP servers. The playbook is a detailed set of
      instructions that guides behaviour of the Robot to help it assist members
      in achieving a specific automation goal. Direct tools support narrowly
      scoped Robots, while Toolsets bundle tools with optional specialist
      instructions. Toolsets can be shared across Robots and can come from
      Storyden, members, plugins, or connected MCP servers.

      ## Request body

      Send JSON using `--file payload.json`, `--file -`, or `--data`. Top-level
      fields:

      - `name` (string, required).
      - `description` (string, required).
      - `playbook` (string, required).
      - `model` (string).
      - `workspace_id` (string).
      - `tools` (array).
      - `toolsets` (array).
      - `meta` (object).

      Inspect the local request and response contract with `sd api schema
      RobotCreate`. This calls `POST /robots` using the selected account. The
      server enforces permissions. The request executes immediately; this is not
      a dry run. After an uncertain network failure, inspect current state
      before retrying a mutation.

      ## Output and automation

      The default `--output json` preserves the complete server response,
      including nested fields and pagination metadata. Empty responses print
      `null`; HEAD responses contain `status` and `headers`. Errors go to stderr
      and return a nonzero exit status. This command sends one request; it does
      not automatically traverse pages or cursors.
