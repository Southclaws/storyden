          description: OAuth client ID.
          required: true
        longDescription: |
          # Read an OAuth client created by the authenticated account

          Read an OAuth client created by the authenticated account.

          Member-created clients are third-party application identities. They
          may be public or confidential but are never first-party
          inherited-permission clients.


          Inspect the local request and response contract with `sd api schema
          OAuthClientGet`. This calls `GET
          /auth/oauth/clients/{oauth_client_id}` using the selected account. The
          server enforces permissions.

          ## Output and automation

          The default `--output json` preserves the complete server response,
          including nested fields and pagination metadata. Empty responses print
          `null`; HEAD responses contain `status` and `headers`. Errors go to
          stderr and return a nonzero exit status. This command sends one
