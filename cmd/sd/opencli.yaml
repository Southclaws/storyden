  - name: oauth
    description: >-
      Administer OAuth clients, grants, connections, and registrations.
    longDescription: |
      # Admin Oauth

      Administer OAuth clients, device authorizations, refresh tokens, remote
      connections, bot-registration approvals, and initial registration tokens.
      These operations manage access to the instance or connected services;
      inspect the selected record before changing or revoking it.

      Commands send one request and return the full JSON response by default.
      Use explicit IDs from list/get output and `--context NAME` for automation.
      Mutations apply immediately; check current state before retrying after a
      network failure.

      ## Examples

      ~~~sh
      sd admin oauth clients --help
      ~~~
    commands:
    - name: clients
      description: Register and configure OAuth clients across the community.
      longDescription: |
        # Admin Oauth Clients

        Manage OAuth client registrations across the instance. List/get reveals
        client IDs and configuration; create/update changes registrations and
        delete removes a registration.

        Commands send one request and return the full JSON response by default.
        Use explicit IDs from list/get output and `--context NAME` for
        automation. Mutations apply immediately; check current state before
        retrying after a network failure.

        ## Examples

        ~~~sh
        sd admin oauth clients list --help
        ~~~
      commands:
      - name: list
        operationId: apiAdminOAuthClientList
        description: List OAuth clients registered for this instance.
        flags:
        - $ref: '#/components/flags/api-output'
        - $ref: '#/components/flags/api-output-file'
        - $ref: '#/components/flags/api-timeout'
        longDescription: |
          # List OAuth clients registered for this instance

          List OAuth clients registered for this instance.

          This admin view includes both member-created third-party clients and
          built-in first-party clients. Built-in clients will not be owned by an
          account; their grants and refresh tokens are owned by the approving
          account instead.


          Inspect the local request and response contract with `sd api schema
          AdminOAuthClientList`. This calls `GET /admin/oauth/clients` using the
          selected account. The server enforces permissions.

          ## Output and automation

          The default `--output json` preserves the complete server response,
          including nested fields and pagination metadata. Empty responses print
          `null`; HEAD responses contain `status` and `headers`. Errors go to
          stderr and return a nonzero exit status. This command sends one
          request; it does not automatically traverse pages or cursors.
        examples:
        - command: sd admin oauth clients list
      - name: create
        operationId: apiAdminOAuthClientCreate
        description: Create an OAuth client.
        flags:
        - $ref: '#/components/flags/api-data'
        - $ref: '#/components/flags/api-file'
        - $ref: '#/components/flags/api-content-type'
        - $ref: '#/components/flags/api-output'
        - $ref: '#/components/flags/api-output-file'
        - $ref: '#/components/flags/api-timeout'
        longDescription: |
          # Create an OAuth client

          Create an OAuth client.

          Confidential clients receive a generated secret once at creation time
          and must authenticate to `/oauth/token` when using confidential
          grants. Public clients do not receive or use a client secret.

          ## Request body

          Send JSON using `--file payload.json`, `--file -`, or `--data`.
          Top-level fields:

          - `account_id` (string, required).
          - `client_id` (string, required).
          - `client_secret_hash` (string).
          - `name` (string, required).
          - `type` (string, required): `public`, `confidential`.
          - `scope_policy` (string): `explicit`, `inherit`.
          - `redirect_uris` (array, required).
          - `allowed_scopes` (array, required).
          - `allowed_grants` (array, required).

          Inspect the local request and response contract with `sd api schema
          AdminOAuthClientCreate`. This calls `POST /admin/oauth/clients` using
          the selected account. The server enforces permissions. The request
          executes immediately; this is not a dry run. After an uncertain
          network failure, inspect current state before retrying a mutation.

          ## Output and automation

          The default `--output json` preserves the complete server response,
          including nested fields and pagination metadata. Empty responses print
          `null`; HEAD responses contain `status` and `headers`. Errors go to
          stderr and return a nonzero exit status. This command sends one
          request; it does not automatically traverse pages or cursors.
        examples:
        - command: sd admin oauth clients create --file payload.json
      - name: get
        operationId: apiAdminOAuthClientGet
        description: Read an OAuth client.
        flags:
        - $ref: '#/components/flags/api-output'
        - $ref: '#/components/flags/api-output-file'
        - $ref: '#/components/flags/api-timeout'
        arguments:
        - name: OAUTH_CLIENT_ID
          description: OAuth client ID.
          required: true
        longDescription: |
          # Read an OAuth client

          Read an OAuth client.

          OAuth clients represent application/software identity. They are not
          the same thing as a user authorisation; user-owned authorisations are
          represented by device authorisations, authorisation requests, and
          refresh tokens.


          Inspect the local request and response contract with `sd api schema
          AdminOAuthClientGet`. This calls `GET
          /admin/oauth/clients/{oauth_client_id}` using the selected account.
          The server enforces permissions.

          ## Output and automation

          The default `--output json` preserves the complete server response,
          including nested fields and pagination metadata. Empty responses print
          `null`; HEAD responses contain `status` and `headers`. Errors go to
          stderr and return a nonzero exit status. This command sends one
          request; it does not automatically traverse pages or cursors.
        examples:
        - command: sd admin oauth clients get OAUTH_CLIENT_ID
      - name: update
        operationId: apiAdminOAuthClientUpdate
        description: Update an OAuth client.
        flags:
        - $ref: '#/components/flags/api-data'
        - $ref: '#/components/flags/api-file'
        - $ref: '#/components/flags/api-content-type'
        - $ref: '#/components/flags/api-output'
        - $ref: '#/components/flags/api-output-file'
        - $ref: '#/components/flags/api-timeout'
        arguments:
        - name: OAUTH_CLIENT_ID
          description: OAuth client ID.
          required: true
        longDescription: |
          # Update an OAuth client

          Update an OAuth client.

          Changing allowed grants or scopes only affects future authorisation
          and refresh operations. Already-issued JWT access tokens remain valid
          until their expiry unless their signing key is rotated.

          For account-owned clients, allowed permission scopes must be grantable
          by the owning account. An account with `ADMINISTRATOR` may configure
          any Storyden permission scope because `ADMINISTRATOR` implicitly
          grants all permissions.

          ## Request body

          Send JSON using `--file payload.json`, `--file -`, or `--data`.
          Top-level fields:

          - `client_secret_hash` (string).
          - `name` (string).
          - `scope_policy` (string): `explicit`, `inherit`.
          - `redirect_uris` (array).
          - `allowed_scopes` (array).
          - `allowed_grants` (array).

          Inspect the local request and response contract with `sd api schema
          AdminOAuthClientUpdate`. This calls `PATCH
          /admin/oauth/clients/{oauth_client_id}` using the selected account.
          The server enforces permissions. The request executes immediately;
          this is not a dry run. After an uncertain network failure, inspect
          current state before retrying a mutation.

          ## Output and automation

          The default `--output json` preserves the complete server response,
          including nested fields and pagination metadata. Empty responses print
          `null`; HEAD responses contain `status` and `headers`. Errors go to
          stderr and return a nonzero exit status. This command sends one
          request; it does not automatically traverse pages or cursors.
        examples:
        - command: sd admin oauth clients update OAUTH_CLIENT_ID --file payload.json
      - name: delete
        operationId: apiAdminOAuthClientDelete
        description: Delete an OAuth client.
        flags:
