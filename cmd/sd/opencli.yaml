      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: AUTH_METHOD_ID
        description: auth method id
        required: true
      longDescription: |
        # Deletes the specified authentication method from the account

        Deletes the specified authentication method from the account. This is
        irreversible however if this authentication method is the only remaining
        method for the account, this operation will fail with a 400 bad request.


        Inspect the local request and response contract with `sd api schema
        AccountAuthMethodDelete`. This calls `DELETE
