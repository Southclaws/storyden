      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: MCP_SERVER_ID
        description: Robot MCP server ID
        required: true
      longDescription: |
        # Get Robot MCP server

        Retrieve an external MCP server configuration and its cached tools.


        Inspect the local request and response contract with `sd api schema
        RobotMCPServerGet`. This calls `GET /robots/mcp-servers/{mcp_server_id}`
        using the selected account. The server enforces permissions.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd robot mcp get MCP_SERVER_ID
    - name: update
      operationId: apiRobotMCPServerUpdate
      description: Update Robot MCP server.
      flags:
      - $ref: '#/components/flags/api-data'
      - $ref: '#/components/flags/api-file'
      - $ref: '#/components/flags/api-content-type'
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: MCP_SERVER_ID
        description: Robot MCP server ID
        required: true
      longDescription: |
        # Update Robot MCP server

        Update an external MCP server configuration. Bearer tokens are
        write-only and are redacted from responses.

        ## Request body

        Send JSON using `--file payload.json`, `--file -`, or `--data`.
        Top-level fields:

        - `name` (string).
        - `description` (string).
        - `endpoint_url` (string).
        - `enabled` (boolean).
        - `bearer_token` (string).
        - `clear_bearer_token` (boolean).

        Inspect the local request and response contract with `sd api schema
        RobotMCPServerUpdate`. This calls `PATCH
        /robots/mcp-servers/{mcp_server_id}` using the selected account. The
        server enforces permissions. The request executes immediately; this is
        not a dry run. After an uncertain network failure, inspect current state
