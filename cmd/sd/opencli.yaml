  - name: participants
    description: Update attendance and roles or remove event participants.
    longDescription: |
      # Event Participants

      Update or remove an account’s participation in an event. Use event get to
      inspect the event and participant state first.

      Commands send one request and return the full JSON response by default.
      Use explicit IDs from list/get output and `--context NAME` for automation.
      Mutations apply immediately; check current state before retrying after a
      network failure.

      ## Examples

      ~~~sh
      sd event participants update --help
      ~~~
    commands:
    - name: update
      operationId: apiEventParticipantUpdate
      description: >-
        Add a participant to an event or change an existing participant's state.
      flags:
      - $ref: '#/components/flags/api-data'
      - $ref: '#/components/flags/api-file'
      - $ref: '#/components/flags/api-content-type'
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: EVENT_MARK
        description: 'Either:

          - The unique event ID.

          - The unique event slug.

          - A string of the form <id>-<slug>'
        required: true
      - name: ACCOUNT_ID
        description: Account ID.
        required: true
      longDescription: |
        # Add or update event participation

        Add a participant to an event or change an existing participant's state.

        If the requesting account is an admin or holds MANAGE_EVENTS permission,
        they can change the participation properties of any account. Otherwise,
        they can only change their own participation properties.

        For non-managing members (i.e. not an admin and not a host) this will
        follow a stricter state machine for the participation status. If the
        participation status is not set (no participation record is present) or
        set to "declined", the member may only set their status to "requested"
        if the event policy is set to "invite_only". Otherwise, they may set it
        to "attending". If the member is already set to one of these states,
        they may change it to "declined".

        A non-managing member cannot change their role and the default is
        "attendee", only managing members can change participant roles.

        If the event participation policy is set to "invite_only" then members
        can only set their status to "requested" or delete their participation.

        If the event participation policy is set to "closed", it's a no-op.

        Requests to this resource are idempotent given identical request bodies.
        It acts as a create-or-update action as participation is account-unique.

        ## Request body

        Send JSON using `--file payload.json`, `--file -`, or `--data`.
        Top-level fields:

        - `role` (string): `attendee`, `host`.
        - `status` (string): `requested`, `invited`, `attending`, `declined`.

        Inspect the local request and response contract with `sd api schema
        EventParticipantUpdate`. This calls `PUT
        /events/{event_mark}/participants/{account_id}` using the selected
        account. The server enforces permissions. The request executes
        immediately; this is not a dry run. After an uncertain network failure,
        inspect current state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd event participants update EVENT_MARK ACCOUNT_ID --file payload.json
    - name: remove
      operationId: apiEventParticipantRemove
      description: Remove a participant from an event.
      flags:
      - $ref: '#/components/flags/api-output'
      - $ref: '#/components/flags/api-output-file'
      - $ref: '#/components/flags/api-timeout'
      arguments:
      - name: EVENT_MARK
        description: 'Either:

          - The unique event ID.

          - The unique event slug.

          - A string of the form <id>-<slug>'
        required: true
      - name: ACCOUNT_ID
        description: Account ID.
        required: true
      longDescription: |
        # Remove a participant from an event

        Remove a participant from an event. Same rules as EventParticipantUpdate
        where non-managing members may only remove themselves. Not soft-delete.


        Inspect the local request and response contract with `sd api schema
        EventParticipantRemove`. This calls `DELETE
        /events/{event_mark}/participants/{account_id}` using the selected
        account. The server enforces permissions. The request executes
        immediately; this is not a dry run. After an uncertain network failure,
        inspect current state before retrying a mutation.

        ## Output and automation

        The default `--output json` preserves the complete server response,
        including nested fields and pagination metadata. Empty responses print
        `null`; HEAD responses contain `status` and `headers`. Errors go to
        stderr and return a nonzero exit status. This command sends one request;
        it does not automatically traverse pages or cursors.
      examples:
      - command: sd event participants remove EVENT_MARK ACCOUNT_ID
- name: robot
  description: Configure Robots, run conversations, and inspect their activity.
  longDescription: |
    # Robot

    Configure and use Storyden Robots. Robots combine a playbook with tools and
    Toolsets. Discover model IDs with `models`, tool names with `tools`, and
    reusable Toolsets with `toolsets list`.

    Use `chat` to submit a text message, then `sessions events` to read
    persisted events. Submission is asynchronous. `sessions get` returns session
    history; `sessions turns cancel` requests cancellation. Robot sessions are
    shared operational resources rather than private chats. Workspace, provider
    and MCP commands manage the integrations Robots use.

    Commands send one request and return the full JSON response by default. Use
    explicit IDs from list/get output and `--context NAME` for automation.
    Mutations apply immediately; check current state before retrying after a
    network failure.

    ## Examples

    ~~~sh
    sd robot list --help
    ~~~
  commands:
