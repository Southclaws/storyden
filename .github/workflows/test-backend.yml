name: Test backend

on:
  push:
    branches:
      - main
    paths-ignore: &ignored_paths
      - "home/**"
      - "web/**"
      - ".vscode/**"
      - "*.md"
      - "docker/**"
      - "docker-compose.yml"
      - "fly.toml"
      - "renovate.json"
      - "*.yml"
      - "*.yaml"
      - ".nvmrc"
      - ".vercelignore"
      - "Taskfile.yml"

  pull_request:
    paths-ignore: *ignored_paths

jobs:
  backend-test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: default
          POSTGRES_PASSWORD: default
          POSTGRES_INITDB_ARGS: "-c max_connections=200"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://default:default@localhost:5432/postgres?sslmode=disable"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: "**/go.sum"

      - run: go run ./cmd/migrate
      - run: go test -p 4 ./...

  backend-test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: go run ./cmd/migrate
      - run: go test -p 4 ./...

  backend-test-libsql:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "libsql://./data/data.db"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: "**/go.sum"
      - run: go run ./cmd/migrate
      - run: go test -p 4 ./...
