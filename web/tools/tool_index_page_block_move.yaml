$schema: "http://json-schema.org/draft-07/schema#"
$id: ToolIndexPageBlockMove
x-storyden-tool:
  title: Move Index Page Block
  path_prefix: /
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
    untrustedContentHint: false
title: index_page_block_move
description: Move a visible block within the current index page layout.
type: object
required: [input, output]
properties:
  input:
    $ref: "#/definitions/ToolIndexPageBlockMoveInput"
  output:
    $ref: "#/definitions/ToolIndexPageBlockMoveOutput"
definitions:
  ToolIndexPageBlockMoveInput:
    type: object
    required: [block]
    properties:
      block:
        $ref: "./common/index_page_layout.yaml#/definitions/IndexPageLayoutBlockType"
      before_block:
        $ref: "./common/index_page_layout.yaml#/definitions/IndexPageLayoutBlockType"
        description: Existing block before which to place the block; omit to move it to the end.
    additionalProperties: false

  ToolIndexPageBlockMoveOutput:
    type: object
    required: [message, layout]
    properties:
      message:
        type: string
        description: Summary of the moved block.
      layout:
        $ref: "./common/index_page_layout.yaml"
    additionalProperties: false
