$schema: "http://json-schema.org/draft-07/schema#"
$id: ToolIndexPageEditStart
x-storyden-tool:
  title: Start Index Page Quick Edit
  path_prefix: /
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
    untrustedContentHint: false
title: index_page_edit_start
description: >-
  Enter quick edit mode for the live index page so frontend-only block tools
  can make the immediate change the user requested. Use this only when the user
  clearly asked to edit the live page. If it is unclear whether they want a
  quick edit or a version draft, ask them before calling this tool.
type: object
required: [input, output]
properties:
  input:
    $ref: "#/definitions/ToolIndexPageEditStartInput"
  output:
    $ref: "#/definitions/ToolIndexPageEditStartOutput"
definitions:
  ToolIndexPageEditStartInput:
    type: object
    properties: {}
    additionalProperties: false

  ToolIndexPageEditStartOutput:
    type: object
    required: [message]
    properties:
      message:
        type: string
        description: Summary of the active edit mode.
    additionalProperties: false
