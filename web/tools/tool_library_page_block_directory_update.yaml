$schema: "http://json-schema.org/draft-07/schema#"
$id: ToolLibraryPageBlockDirectoryUpdate
x-storyden-tool:
  title: Update Library Page Directory Block
  path_prefix: /l/
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
    untrustedContentHint: false
title: library_page_block_directory_update
description: Update the presentation of the visible directory block on the current Library page.
type: object
required: [input, output]
properties:
  input:
    $ref: "#/definitions/ToolLibraryPageBlockDirectoryUpdateInput"
  output:
    $ref: "#/definitions/ToolLibraryPageBlockDirectoryUpdateOutput"
definitions:
  ToolLibraryPageBlockDirectoryUpdateInput:
    type: object
    required: [layout]
    properties:
      layout:
        type: string
        enum: [table, grid]
    additionalProperties: false

  ToolLibraryPageBlockDirectoryUpdateOutput:
    type: object
    required: [message, layout]
    properties:
      message:
        type: string
        description: Summary of the updated directory block.
      layout:
        $ref: "./common/library_page_layout.yaml"
    additionalProperties: false
