$schema: "http://json-schema.org/draft-07/schema#"
$id: ToolLibraryPageBlockDirectoryUpdate
x-storyden-tool:
  title: Update Library Page Directory Block
  path_prefix: /l/
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
    untrustedContentHint: false
title: library_page_block_directory_update
description: >-
  Update the presentation of the visible directory block on the Library page (node) currently displayed in the frontend.
  Match the requested page to datagraph_item.id in invocation context when datagraph_item.kind is "node".
type: object
required: [input, output]
properties:
  input:
    $ref: "#/definitions/ToolLibraryPageBlockDirectoryUpdateInput"
  output:
    $ref: "#/definitions/ToolLibraryPageBlockDirectoryUpdateOutput"
definitions:
  ToolLibraryPageBlockDirectoryUpdateInput:
    type: object
    required: [layout]
    properties:
      layout:
        type: string
        enum: [table, rows, grid, gallery]
        description: >-
          Directory presentation: table shows rows and columns; rows shows compact image-capable cards; grid shows cards in regular columns with fixed-ratio images;
          gallery uses a masonry-style arrangement with variable image heights.
          When the user names a mode, select that exact value.
    additionalProperties: false

  ToolLibraryPageBlockDirectoryUpdateOutput:
    type: object
    required: [message, layout]
    properties:
      message:
        type: string
        description: Summary of the updated directory block.
      layout:
        $ref: "./common/library_page_layout.yaml"
    additionalProperties: false
