$schema: "http://json-schema.org/draft-07/schema#"
$id: ToolIndexPageBlockAdd
x-storyden-tool:
  title: Add Index Page Block
  path_prefix: /
  annotations:
    readOnlyHint: false
    destructiveHint: false
    idempotentHint: true
    openWorldHint: false
    untrustedContentHint: false
title: index_page_block_add
description: Add a currently hidden block to the current index page.
type: object
required: [input, output]
properties:
  input:
    $ref: "#/definitions/ToolIndexPageBlockAddInput"
  output:
    $ref: "#/definitions/ToolIndexPageBlockAddOutput"
definitions:
  ToolIndexPageBlockAddInput:
    type: object
    required: [block]
    properties:
      block:
        $ref: "./common/index_page_layout.yaml#/definitions/IndexPageLayoutBlockType"
      after_block:
        $ref: "./common/index_page_layout.yaml#/definitions/IndexPageLayoutBlockType"
        description: Existing block after which to insert the block; omit to append it.
    additionalProperties: false

  ToolIndexPageBlockAddOutput:
    type: object
    required: [message, layout]
    properties:
      message:
        type: string
        description: Summary of the added block.
      layout:
        $ref: "./common/index_page_layout.yaml"
    additionalProperties: false
