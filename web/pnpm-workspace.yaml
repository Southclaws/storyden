packages:
  - "."

minimumReleaseAge: 10080
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  "@parcel/watcher": true
patchedDependencies:
  # Prevent deferred focus from stealing focus after Escape closes a menu.
  '@zag-js/menu@1.43.3': patches/@zag-js__menu@1.43.3.patch
  # Keep plain "a" available for tree typeahead; covered by DragTree.test.tsx.
  '@zag-js/tree-view@1.43.3': patches/@zag-js__tree-view@1.43.3.patch
